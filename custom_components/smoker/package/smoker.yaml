# Gravity 980 smoker: Home Assistant package
#
# Install: copy to /config/packages/smoker.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. See docs/install.md.
#
# Assumes the ESPHome device is named "gravity980" with friendly name "Smoker"
# (entity ids sensor.smoker_*, actions esphome.gravity980_*).
#
# Edit the lines marked EDIT below: your phone (once) and your AI task entity (three times).
#
# Needs the Smoker integration (custom_components/smoker, through HACS): it checks the controller's esphome.smoker_*
# events (any ESPHome device can fire those and claim to be the smoker) and passes the genuine ones on as
# smoker_controller_notify / smoker_controller_context / smoker_controller_cook_complete, which this package listens to.

# ------------------------------------------------------------------- history

# The notification buttons' one-off codes stay out of the history database (they're no use there). This merges into
# your own recorder: settings; it takes effect at the next restart.
recorder:
  exclude:
    entities:
      - input_text.smoker_notify_codes

# ------------------------------------------------------------------- helpers

input_boolean:
  smoker_ai_advisor:
    name: Smoker AI advisor
    icon: mdi:robot-outline
    # No `initial:`: Home Assistant keeps your on/off across restarts (it used to switch itself back on after every
    # restart and update, spending AI credits). A new install starts off.

input_number:
  smoker_ai_eta_minutes:
    name: Smoker AI ETA (minutes)
    min: 0
    max: 3000
    step: 1
    mode: box
    icon: mdi:robot
  smoker_rest_minutes:
    name: Smoker rest time
    min: 0
    max: 240
    step: 5
    initial: 60
    unit_of_measurement: min
    icon: mdi:timer-sand
  # The hottest pit an AI-written cook program may set (in °F, whatever the controller's unit). A program that asks
  # for more is not loaded. Back to 400 at every restart: EDIT `initial` to change it for good.
  smoker_ai_max_pit:
    name: Smoker AI plan max pit
    min: 200
    max: 700
    step: 5
    initial: 400
    mode: box
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert

  # Charcoal stock and cost (features: Setup > Supplies). Set the bag size and price once; "Bought a bag" adds one.
  smoker_charcoal_stock_kg:
    name: Smoker charcoal in stock
    min: 0
    max: 500
    step: 0.1
    mode: box
    unit_of_measurement: kg
    icon: mdi:sack
  smoker_charcoal_bag_kg:
    name: Smoker charcoal bag size
    min: 0
    max: 50
    step: 0.1
    mode: box
    unit_of_measurement: kg
    icon: mdi:weight-kilogram
  smoker_charcoal_bag_price:
    name: Smoker charcoal bag price
    min: 0
    max: 500
    step: 0.01
    mode: box
    icon: mdi:cash
  smoker_charcoal_burned_kg:
    name: Smoker charcoal burned (total)
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kg
    icon: mdi:fire
  smoker_charcoal_cook_start_kg:
    name: Smoker charcoal burned at the cook's start
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    unit_of_measurement: kg
  # Maintenance: burn hours since each job was last done (they count while a cook is on).
  smoker_hours_ash:
    name: Smoker hours since the ash was emptied
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: h
    icon: mdi:delete-empty
  smoker_hours_grease:
    name: Smoker hours since the grease tray was cleaned
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: h
    icon: mdi:water-opacity
  smoker_hours_gasket:
    name: Smoker hours since the gasket and fan were checked
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: h
    icon: mdi:fan

input_text:
  smoker_ai_plan:
    name: Smoker AI plan
    max: 255
  smoker_charcoal_last_cook:
    name: Smoker charcoal, last cook
    max: 255
  smoker_serve_source:
    name: Smoker serve-by came from
    max: 32
  # Any thermometer already in Home Assistant (a Wi-Fi/Bluetooth probe, another grill...): put its temperature
  # entity here, then pick "Home Assistant" as the source on that food slot (select.smoker_food_N_probe).
  # Left empty, slots 3-6 use the Govee H5198 ("Meat Thermometer") probes 1-4. EDIT the defaults in the
  # "Smoker external probe N" template sensors below if yours are named differently.
  # The controller reads sensor.smoker_external_probe_N, which follows whatever entity you name (stated in °F;
  # Home Assistant shows and passes it in your unit system, which is `weather_temperature_unit` on the controller).
  smoker_external_probe_1_entity:
    name: Smoker external probe 1 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_2_entity:
    name: Smoker external probe 2 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_3_entity:
    name: Smoker external probe 3 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_4_entity:
    name: Smoker external probe 4 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_5_entity:
    name: Smoker external probe 5 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_6_entity:
    name: Smoker external probe 6 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_ai_summary:
    name: Smoker AI summary
    max: 255
  smoker_ai_suggestion:
    name: Smoker AI suggestion
    max: 255
  smoker_ai_last_cook:
    name: Smoker last cook summary
    max: 255
  smoker_plan_request:
    name: Smoker plan request
    max: 255
    icon: mdi:chat-processing
  # One-off codes on the notification buttons ("code:time", the last few): a button press only counts when it carries
  # the code of a notification this package sent in the last 2 hours. Filled in by script.smoker_notify; kept out of
  # the history database (recorder: below).
  smoker_notify_codes:
    name: Smoker notification codes
    max: 255
    icon: mdi:shield-key
  # A cook started by voice waits here for "confirm smoker start" ("preset|time|who": who = the voice device and the
  # user who asked; only the same ones can confirm).
  smoker_voice_pending:
    name: Smoker voice start waiting for confirmation
    max: 255
    icon: mdi:microphone-question
  # A big pit change asked by voice (more than 50°F / 28°C at once) waits here for "confirm smoker temperature"
  # ("value|time|who").
  smoker_voice_pit_pending:
    name: Smoker voice pit change waiting for confirmation
    max: 255
    icon: mdi:microphone-question

input_datetime:
  smoker_ai_finish:
    name: Smoker AI finish time
    has_date: true
    has_time: true
    icon: mdi:robot
  smoker_serve_time:
    name: Smoker serve by
    has_date: true
    has_time: true
    icon: mdi:silverware-fork-knife

timer:
  smoker_rest:
    name: Smoker rest timer
    icon: mdi:timer-sand-complete

# ------------------------------------------------------------------- derived sensors

template:
  # Latest context the controller sent (esphome.smoker_context, checked and passed on by the Smoker integration as
  # smoker_controller_context): live state and cook history as JSON, for the AI.
  - triggers:
      - trigger: event
        event_type: smoker_controller_context
    conditions:
      # Passed on by the integration inside Home Assistant (a phone's webhook can fire any event name, but only as a
      # remote event with its user attached), for the smoker controller.
      - condition: template
        value_template: >
          {{ trigger.event.origin | string == 'LOCAL' and trigger.event.context.user_id is none and
             'gravity980' in (device_attr(trigger.event.data.device_id | default(''), 'model') or '') | lower }}
    sensor:
      - name: Smoker AI context
        unique_id: smoker_ai_context
        icon: mdi:code-json
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        attributes:
          state_json: "{{ trigger.event.data.state }}"
          history_json: "{{ trigger.event.data.history }}"
  # The AI's recommendations for the dashboard (kept across restarts).
  - triggers:
      - trigger: event
        event_type: smoker_ai_recommendations
    sensor:
      - name: Smoker recommendations
        unique_id: smoker_ai_recommendations
        icon: mdi:chef-hat
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          mode: "{{ trigger.event.data.mode }}"
          summary: "{{ trigger.event.data.summary }}"
          items: "{{ trigger.event.data['items'] }}"
  - sensor:
      - name: Smoker external probe 1
        unique_id: smoker_external_probe_1
        device_class: temperature
        unit_of_measurement: "°F"
        state_class: measurement
        state: >
          {% set h = states('input_text.smoker_external_probe_1_entity') %}
          {% set e = h if h.startswith('sensor.') else '' %}
          {% set v = states(e) if e.startswith('sensor.') else 'unknown' %}
          {% set c = (state_attr(e, 'unit_of_measurement') or '') in ['°C', 'C'] %}
          {% set f = ((v | float * 1.8 + 32) if c else v | float) | round(1) if is_number(v) else none %}
          {# Govee thermometers report an unplugged probe as exactly 0 °C (32 °F): that's no reading. #}
          {{ none if f == 32.0 and (device_attr(e, 'manufacturer') or '') | lower is search('govee') else f }}
        attributes:
          source: >
            {% set h = states('input_text.smoker_external_probe_1_entity') %}
            {% set e = h if h.startswith('sensor.') else '' %}
            {{ e }}
      - name: Smoker external probe 1 target
        unique_id: smoker_external_probe_1_target
        device_class: temperature
        unit_of_measurement: "°F"
        state: >
          {% set h = states('input_text.smoker_external_probe_1_entity') %}
          {% set e = h if h.startswith('sensor.') else '' %}
          {# The thermometer's own alarm for that probe, when it has one (Govee: ..._temperature_alarm_probe_N). #}
          {% set a = e | replace('_temperature_probe_', '_temperature_alarm_probe_') %}
          {% set v = states(a) if a != e and a.startswith('sensor.') else 'unknown' %}
          {% set c = (state_attr(a, 'unit_of_measurement') or '') in ['°C', 'C'] %}
          {% set f = ((v | float * 1.8 + 32) if c else v | float) | round(1) if is_number(v) else none %}
          {{ none if f is none or f <= 32.0 else f }}
      - name: Smoker external probe 2
        unique_id: smoker_external_probe_2
        device_class: temperature
        unit_of_measurement: "°F"
        state_class: measurement
        state: >
          {% set h = states('input_text.smoker_external_probe_2_entity') %}
          {% set e = h if h.startswith('sensor.') else '' %}
          {% set v = states(e) if e.startswith('sensor.') else 'unknown' %}
          {% set c = (state_attr(e, 'unit_of_measurement') or '') in ['°C', 'C'] %}
          {% set f = ((v | float * 1.8 + 32) if c else v | float) | round(1) if is_number(v) else none %}
