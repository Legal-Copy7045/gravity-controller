# Gravity 980 smoker: Home Assistant package
#
# Install: copy to /config/packages/smoker.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. See docs/install.md.
#
# Assumes the ESPHome device is named "gravity980" with friendly name "Smoker"
# (entity ids sensor.smoker_*, actions esphome.gravity980_*).
#
# Edit the lines marked EDIT below: your phone (once) and your AI task entity (three times).

# ------------------------------------------------------------------- helpers

input_boolean:
  smoker_ai_advisor:
    name: Smoker AI advisor
    icon: mdi:robot-outline
    initial: true

input_number:
  smoker_ai_eta_minutes:
    name: Smoker AI ETA (minutes)
    min: 0
    max: 3000
    step: 1
    mode: box
    icon: mdi:robot
  smoker_rest_minutes:
    name: Smoker rest time
    min: 0
    max: 240
    step: 5
    initial: 60
    unit_of_measurement: min
    icon: mdi:timer-sand

input_text:
  # Any thermometer already in Home Assistant (a Wi-Fi/Bluetooth probe, another grill...): put its temperature
  # entity here, then pick "Home Assistant" as the source on that food slot (select.smoker_food_N_probe).
  # Left empty, slots 3-6 use the Govee H5198 ("Meat Thermometer") probes 1-4. EDIT the defaults in the
  # "Smoker external probe N" template sensors below if yours are named differently.
  # The controller reads sensor.smoker_external_probe_N, which follows whatever entity you name (stated in °F;
  # Home Assistant shows and passes it in your unit system, which is `weather_temperature_unit` on the controller).
  smoker_external_probe_1_entity:
    name: Smoker external probe 1 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_2_entity:
    name: Smoker external probe 2 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_3_entity:
    name: Smoker external probe 3 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_4_entity:
    name: Smoker external probe 4 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_5_entity:
    name: Smoker external probe 5 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_external_probe_6_entity:
    name: Smoker external probe 6 entity
    max: 120
    icon: mdi:thermometer-probe
  smoker_ai_summary:
    name: Smoker AI summary
    max: 255
  smoker_ai_suggestion:
    name: Smoker AI suggestion
    max: 255
  smoker_ai_last_cook:
    name: Smoker last cook summary
    max: 255
  smoker_plan_request:
    name: Smoker plan request
    max: 255
    icon: mdi:chat-processing

input_datetime:
  smoker_ai_finish:
    name: Smoker AI finish time
    has_date: true
    has_time: true
    icon: mdi:robot
  smoker_serve_time:
    name: Smoker serve by
    has_date: true
    has_time: true
    icon: mdi:silverware-fork-knife

timer:
  smoker_rest:
    name: Smoker rest timer
    icon: mdi:timer-sand-complete

# ------------------------------------------------------------------- derived sensors

template:
  # Latest context the controller sent (esphome.smoker_context): live state and cook history as JSON, for the AI.
  - triggers:
      - trigger: event
        event_type: esphome.smoker_context
    sensor:
      - name: Smoker AI context
        unique_id: smoker_ai_context
        icon: mdi:code-json
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        attributes:
          state_json: "{{ trigger.event.data.state }}"
          history_json: "{{ trigger.event.data.history }}"
  # The AI's recommendations for the dashboard (kept across restarts).
  - triggers:
      - trigger: event
        event_type: smoker_ai_recommendations
    sensor:
      - name: Smoker recommendations
        unique_id: smoker_ai_recommendations
        icon: mdi:chef-hat
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          mode: "{{ trigger.event.data.mode }}"
          summary: "{{ trigger.event.data.summary }}"
          items: "{{ trigger.event.data['items'] }}"
  - sensor:
      - name: Smoker external probe 1
        unique_id: smoker_external_probe_1
        device_class: temperature
        unit_of_measurement: "°F"
        state_class: measurement
        state: >
          {% set h = states('input_text.smoker_external_probe_1_entity') %}
          {% set e = h if h.startswith('sensor.') else '' %}
          {% set v = states(e) if e.startswith('sensor.') else 'unknown' %}
          {% set c = (state_attr(e, 'unit_of_measurement') or '') in ['°C', 'C'] %}
          {% set f = ((v | float * 1.8 + 32) if c else v | float) | round(1) if is_number(v) else none %}
          {# Govee thermometers report an unplugged probe as exactly 0 °C (32 °F): that's no reading. #}
          {{ none if f == 32.0 and (device_attr(e, 'manufacturer') or '') | lower is search('govee') else f }}
        attributes:
          source: >
            {% set h = states('input_text.smoker_external_probe_1_entity') %}
            {% set e = h if h.startswith('sensor.') else '' %}
            {{ e }}
      - name: Smoker external probe 1 target
        unique_id: smoker_external_probe_1_target
        device_class: temperature
        unit_of_measurement: "°F"
        state: >
          {% set h = states('input_text.smoker_external_probe_1_entity') %}
          {% set e = h if h.startswith('sensor.') else '' %}
          {# The thermometer's own alarm for that probe, when it has one (Govee: ..._temperature_alarm_probe_N). #}
          {% set a = e | replace('_temperature_probe_', '_temperature_alarm_probe_') %}
          {% set v = states(a) if a != e and a.startswith('sensor.') else 'unknown' %}
          {% set c = (state_attr(a, 'unit_of_measurement') or '') in ['°C', 'C'] %}
          {% set f = ((v | float * 1.8 + 32) if c else v | float) | round(1) if is_number(v) else none %}
          {{ none if f is none or f <= 32.0 else f }}
