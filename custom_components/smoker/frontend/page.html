<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smoker</title>
<style>
/* page-specific tokens (ember accent comes from style.css --page) */
:root{--pit:#c2410c;--food1:#2b7fb8;--food2:#7c3aed;--g1:#0f9d76;--g2:#b5552a;--g3:#a16207;--g4:#be185d;--ai:#6d28d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pit:#fb8a3c;--food1:#4aa8dd;--food2:#a78bfa;--g1:#34d399;--g2:#e58a5c;--g3:#facc15;--g4:#f472b6;--ai:#a78bfa}}
:root[data-theme="dark"]{--pit:#fb8a3c;--food1:#4aa8dd;--food2:#a78bfa;--g1:#34d399;--g2:#e58a5c;--g3:#facc15;--g4:#f472b6;--ai:#a78bfa}
.hero .big{font:600 clamp(44px,8vw,76px)/1 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .big small{font:500 18px "Instrument Sans",sans-serif;color:var(--ink-2);margin-left:6px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip.exp{background:color-mix(in srgb,var(--ai) 14%,transparent);color:var(--ai);text-transform:none;letter-spacing:normal;vertical-align:middle}
.chip{font:600 11.5px "Instrument Sans",system-ui,sans-serif;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.hot{background:color-mix(in srgb,var(--pit) 18%,transparent);color:var(--pit)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.statusline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.stale{background:var(--warn)}.dot.off{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:500 26px/1.15 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font:500 13px "Instrument Sans",sans-serif;color:var(--ink-2);margin-left:3px}
.kpi .n{font-size:12.5px;color:var(--ink-2)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpi .v{font-size:21px}}
h2.sec{font:700 22px/1.2 "Bricolage Grotesque";padding-top:14px;border-top:2px solid var(--page);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;position:relative;overflow:hidden}
.tc.probe .edge{position:absolute;left:0;top:0;bottom:0;width:4px}
.tc h3{margin:0 0 8px;font:700 16px "Bricolage Grotesque";display:flex;justify-content:space-between;gap:8px;align-items:center}
.tc h3 small{font:500 12px "Instrument Sans",system-ui,sans-serif;color:var(--muted)}
.ptemp{font:600 38px/1.05 "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.ptemp small{font:500 15px "Instrument Sans",system-ui,sans-serif;color:var(--muted);margin-left:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.row .r{font:500 12.5px "JetBrains Mono",monospace;text-align:right}
.btn{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px "Instrument Sans",sans-serif;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--page)}.btn.pri{background:var(--page);color:var(--on-page,#fff);border-color:var(--page)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.step{display:flex;align-items:center;gap:8px}
.step .btn{min-width:44px;font-size:16px;padding:4px 10px}
.step .val{font:600 22px "JetBrains Mono",monospace;min-width:84px;text-align:center}
input,select,textarea{font:500 14px "Instrument Sans",sans-serif;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px;box-sizing:border-box}
textarea{width:100%;min-height:64px;resize:vertical;font-family:"JetBrains Mono",monospace;font-size:12.5px}
input[type=number]{width:84px}
.tg{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.tg.on{background:var(--page)}.tg.on::after{left:21px}
.eta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.eta .t{font:600 22px "JetBrains Mono",monospace}
.range{height:8px;border-radius:999px;background:var(--sunk);position:relative;margin:8px 0 2px}
.range .band{position:absolute;top:0;bottom:0;border-radius:999px;background:color-mix(in srgb,var(--page) 35%,transparent)}
.range .mid{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--page)}
.range .ai{position:absolute;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--ai);border:2px solid var(--surface);transform:translateX(-50%)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.chart{height:280px;position:relative}
.chart svg{width:100%;height:100%;display:block}
.chart text{font:11px "JetBrains Mono",monospace;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);padding:5px 10px;font:600 12px "Instrument Sans",system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--on-page,#fff)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.fold summary{cursor:pointer;font:700 15px "Bricolage Grotesque"}
.err{color:var(--bad);font-size:12.5px;margin-top:6px}
.recs{display:grid;gap:0}
.rec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.rec:first-child{border-top:0}
.rec .w{font:600 12px "JetBrains Mono",monospace;color:var(--page);white-space:nowrap;min-width:86px}
.rec .t{font-weight:700}
.rec .d{grid-column:2;color:var(--ink-2);font-size:14px}
@media (max-width:560px){.rec{grid-template-columns:1fr}.rec .d{grid-column:1}}
.fracs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fracs .btn{min-width:52px}
.gauge{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:6px 0}
.gauge i{display:block;height:100%;background:var(--page);border-radius:999px}
.gauge i.low{background:var(--bad)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.item .n{font-weight:600}.item .m{grid-column:1;color:var(--ink-2);font-size:12.5px}
.item select{grid-row:1 / span 2;grid-column:2}
.je{padding:12px 0;border-top:1px solid var(--line)}
.je:first-child{border-top:0}
.je .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.je .t{font:700 15px "Bricolage Grotesque"}
.je .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stars button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--line);padding:0 1px}
.stars button.on{color:var(--warn)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
footer{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">Smoker · live</div>
      <h1 id="title">Smoker</h1>
      <div class="big" id="pitbig">--<small>°F pit</small></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="art">
      <span class="l">Status</span>
      <span class="statusline"><span class="dot" id="ldot"></span><span id="lstatus">Connecting to Home Assistant…</span></span>
      <span class="n small" id="gstatus"></span>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <section class="live" id="recs"></section>

  <h2 class="sec">Pit &amp; program</h2>
  <div class="grid">
    <section class="tc" id="pitcard"></section>
    <section class="tc" id="progcard"></section>
    <section class="tc" id="aicard"></section>
    <section class="tc" id="fuelcard"></section>
  </div>

  <h2 class="sec">Food</h2>
  <div class="grid" id="probes"></div>
  <details class="fold" data-k="sources"><summary>Probe sources (grill, H5198, Home Assistant)</summary><div id="sources"></div></details>

  <h2 class="sec">Temperatures <span class="seg" id="range" style="float:right;margin-top:2px"></span></h2>
  <section class="tc"><div class="chart" id="chart"></div><div class="legend" id="legend"></div></section>

  <h2 class="sec">Plan</h2>
  <div class="grid">
    <section class="tc" id="plancard"></section>
    <section class="tc" id="scancard"></section>
    <section class="tc" id="learncard"></section>
  </div>

  <h2 class="sec">Cook journal</h2>
  <section class="tc" id="journal"><div id="jlist"><div class="empty">Loading…</div></div>
    <div id="jcmp" style="display:none"><h3 id="jcmptitle" style="margin-top:14px">Compared with similar cooks</h3>
      <div class="chart" id="jchart"></div><div class="legend" id="jlegend"></div></div></section>

  <details class="fold" data-k="diag"><summary>Controller &amp; connection</summary><div id="diag"></div></details>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<script>
/*COMMON*/

// ---------------------------------------------------------------- entity discovery (by friendly name, not entity id)
const DEV = 'Smoker';
const PROBES = [
  { key: 'food1', label: 'Food 1', color: 'var(--food1)' },
  { key: 'food2', label: 'Food 2', color: 'var(--food2)' },
  { key: 'food3', label: 'Food 3', color: 'var(--g1)' },
  { key: 'food4', label: 'Food 4', color: 'var(--g2)' },
  { key: 'food5', label: 'Food 5', color: 'var(--g3)' },
  { key: 'food6', label: 'Food 6', color: 'var(--g4)' },
];
const cache = {};
function E(name, doms) {
  const k = name + '|' + (doms || []).join(',');
  const hit = cache[k];
  if (hit && S(hit)) return hit;
  const eid = byName(DEV + ' ' + name, doms) || byName(name, doms);
  if (eid) cache[k] = eid;
  return eid;
}
const unitOf = eid => { const s = S(eid); return (s && s.attributes && s.attributes.unit_of_measurement) || ''; };
const fmt = (v, d = 0) => v == null ? '--' : Number(v).toFixed(d);
const TU = () => (unitOf(E('Pit temperature', ['sensor'])) || '°F');
const isF = () => TU().indexOf('F') >= 0;
// "Experimental": shown on estimates the controller hasn't got enough history for yet (it says so itself).
const EXP = why => `<span class="chip exp" title="${esc(why)}">Experimental</span>`;
const isExp = info => /^Experimental/.test(info || '');
const pullExp = info => /pull-at experimental/.test(info || '');
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
const fail = e => toast('⚠ ' + ((e && e.message) || e));
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
// Re-render a section only when its HTML changed; never under someone typing; keep text the user has edited
// (fields marked dirty by the input listener below) until it's sent.
function put(id, html) {
  const el = $(id); if (!el) return; if (el._h === html) return; if (typing() && el.contains(document.activeElement)) return;
  const keep = {}; el.querySelectorAll('textarea[id],input[id]').forEach(f => { if (f.dataset.dirty) keep[f.id] = f.value; });
  el._h = html; el.innerHTML = html;
  Object.entries(keep).forEach(([k, v]) => { const f = $(k); if (f) { f.value = v; f.dataset.dirty = '1'; } });
}
document.addEventListener('input', e => { if (e.target && e.target.id) e.target.dataset.dirty = '1'; });
const clean = id => { const f = $(id); if (f) delete f.dataset.dirty; };
const minsTxt = m => m == null ? '--' : m < 60 ? Math.round(m) + ' min' : Math.floor(m / 60) + 'h ' + String(Math.round(m % 60)).padStart(2, '0') + 'm';
const atTxt = m => m == null ? '--' : clock(Date.now() + m * 60000);

// ---------------------------------------------------------------- actions
function setNum(eid, v) { return eid ? H().call('number', 'set_value', eid, { value: v }).catch(fail) : null; }
function press(name) { const e = E(name, ['button']); return e ? H().call('button', 'press', e).catch(fail) : fail('missing ' + name); }
function esph(svc, data) { return H().service('esphome', 'gravity980_' + svc, data || {}).catch(fail); }
window.act = {
  pit(delta) {
    const e = E('Pit target', ['number']); const cur = num(e); if (cur == null) return fail('pit target unknown');
    const step = isF() ? 5 : 2; setNum(e, cur + delta * step);
  },
  target(key, delta) {
    const p = PROBES.find(x => x.key === key); const e = E(p.label + ' target', ['number']); const cur = num(e);
    if (cur == null) return fail('target unknown');
    const st = S(e), step = (st && st.attributes && st.attributes.step) || (isF() ? 1 : 0.5);
    setNum(e, cur + delta * step);
  },
  targetSet(key, v) { const p = PROBES.find(x => x.key === key); setNum(E(p.label + ' target', ['number']), parseFloat(v)); },
  profile(key, v) { const p = PROBES.find(x => x.key === key); const e = E(p.label + ' protein', ['select']); e && H().call('select', 'select_option', e, { option: v }).catch(fail); },
  weight(key, v) { const p = PROBES.find(x => x.key === key); setNum(E(p.label + ' weight', ['number']), parseFloat(v) || 0); },
  source(key, v) { const p = PROBES.find(x => x.key === key); const e = E(p.label + ' probe', ['select']); e && H().call('select', 'select_option', e, { option: v }).then(() => toast(p.label + ' reads ' + v)).catch(fail); },
  extEntity(n, v) { const e = byName('Smoker external probe ' + n + ' entity', ['input_text']); e && H().call('input_text', 'set_value', e, { value: (v || '').trim() }).then(() => toast(v ? 'Food ' + n + ' reads ' + v : 'Food ' + n + ': default thermometer')).catch(fail); },
  wrap(key) { const p = PROBES.find(x => x.key === key); const e = E(p.label + ' wrapped', ['switch']); e && H().call('switch', 'toggle', e).catch(fail); },
  preset(v) { clean('progtext'); const e = E('Program preset', ['select']); e && H().call('select', 'select_option', e, { option: v }).then(() => toast('Preset loaded')).catch(fail); },
  // The typed text stays until the controller shows it as its program (a refused program keeps your text).
  load() { const t = $('progtext').value.trim(); if (!t) return; esph('load_program', { program: t }).then(() => toast('Program sent')); },
  prog(svc) { esph(svc).then(() => toast(svc.replace('_', ' '))); },
  plan() {
    const t = $('plantext').value.trim(); if (!t) return toast('Describe the cook first');
    toast('Asking the AI…'); H().service('script', 'smoker_plan_cook', { request: t }).then(() => { clean('plantext'); toast('Plan requested: check notifications'); }).catch(fail);
  },
  advise() { toast('Asking the AI…'); H().service('script', 'smoker_ai_advise', {}).catch(fail); },
  serve(v) {
    const e = E('Smoker serve by', ['input_datetime']) || byName('Smoker serve by', ['input_datetime']);
    if (!e || !v) return; H().call('input_datetime', 'set_datetime', e, { datetime: v.replace('T', ' ') + ':00' }).then(() => toast('Serve time set')).catch(fail);
  },
  toggle(eid) { const d = eid.split('.')[0]; H().call(d, 'toggle', eid).catch(fail); },
  range(h) { chartHours = h; lastChart = 0; render(); },
  fuelMode(m) { fuelMode = m; renderFuel(); },
  fuel(pct) {
    const svc = { start: 'fuel_refilled', check: 'fuel_level', refill: 'fuel_refilled', add: 'fuel_added', end: 'fuel_end' }[fuelMode];
    esph(svc, { percent: pct }).then(() => toast({ start: 'Starting level', check: 'Level', refill: 'Topped up to', add: 'Added', end: 'Finished with' }[fuelMode] + ' ' + pct + '%'));
  },
  fuelType(v) { const e = E('Charcoal type', ['select']); e && H().call('select', 'select_option', e, { option: v }).catch(fail); },
  pulled(key) { const p = PROBES.find(x => x.key === key); const e = E(p.label + ' pulled', ['switch']); e && H().call('switch', 'toggle', e).catch(fail); },
  slice(v) { setNum(E('Slice at', ['number']), parseFloat(v)); },
  scan() {
    const f = $('scanfiles'); if (!f || !f.files.length) return toast('Take or pick a photo of the label or barcode first');
    const fd = new FormData(); [...f.files].slice(0, 6).forEach(x => fd.append('photo', x, x.name || 'photo.jpg'));
    toast('Reading the labels…'); $('scanbtn') && ($('scanbtn').disabled = true);
    H().api('POST', '/api/smoker/identify', fd).then(r => { journal.draft = r.draft; f.value = ''; renderScan(true);
      toast(r.items.length ? 'Found ' + r.items.length + ' item' + (r.items.length > 1 ? 's' : '') : 'Nothing recognised: try a clearer photo of the label'); })
      .catch(fail).finally(() => { $('scanbtn') && ($('scanbtn').disabled = false); });
  },
  assign(id, probe) {
    const items = (journal.draft.items || []).map(i => i.id === id ? Object.assign({}, i, { probe: probe || null }) : i);
    H().api('POST', '/api/smoker/draft', { items }).then(d => { journal.draft = d; renderScan(true); toast(d.problems && d.problems.length ? d.problems.join('; ') : probe ? 'Probe set from the label' : 'Unassigned'); }).catch(fail);
  },
  dropItem(id) {
    const items = (journal.draft.items || []).filter(i => i.id !== id);
    H().api('POST', '/api/smoker/draft', { items }).then(d => { journal.draft = d; renderScan(true); }).catch(fail);
  },
  rate(id, n) { H().api('POST', '/api/smoker/journal/' + id, { rating: n }).then(() => loadJournal(true)).catch(fail); },
  note(id) { const f = $('jn-' + id); if (!f) return;
    H().api('POST', '/api/smoker/journal/' + id, { notes: f.value }).then(() => { clean('jn-' + id); toast('Saved'); loadJournal(true); }).catch(fail); },
  compare(id) { compareCooks(id).catch(fail); },
  jall() { journalAll = true; renderJournal(true); },
};

// ---------------------------------------------------------------- sections
function probeState(p) {
  const t = num(E(p.label + ' temperature', ['sensor']));
  const tgtE = E(p.label + ' target', ['number']) || E(p.label + ' target (reported)', ['sensor']);
  return {
    t, tgt: num(tgtE), tgtE,
    phase: val(E(p.label + ' phase', ['sensor'])),
    rem: num(E(p.label + ' time remaining', ['sensor'])),
    lo: num(E(p.label + ' time remaining (early)', ['sensor'])),
    hi: num(E(p.label + ' time remaining (late)', ['sensor'])),
    total: num(E(p.label + ' estimated total cook time', ['sensor'])),
    stallRem: num(E(p.label + ' stall remaining', ['sensor'])),
    rate: num(E(p.label + ' rate', ['sensor'])), rateU: unitOf(E(p.label + ' rate', ['sensor'])),
    weightU: unitOf(E(p.label + ' weight', ['number'])),
    finish: val(E(p.label + ' finish time', ['sensor'])),
    source: val(E(p.label + ' probe', ['select'])),
    stall: val(E(p.label + ' stall', ['binary_sensor'])) === 'on',
    warn: val(E(p.label + ' probe warning', ['binary_sensor'])) === 'on',
    profile: S(E(p.label + ' protein', ['select'])),
    weight: num(E(p.label + ' weight', ['number'])),
    wrapE: E(p.label + ' wrapped', ['switch']),
    info: val(E(p.label + ' estimate basis', ['sensor'])),
    pullAt: num(E(p.label + ' pull at', ['sensor'])),
    pulledE: E(p.label + ' pulled', ['switch']),
    isPulled: val(E(p.label + ' pulled', ['switch'])) === 'on',
    restReady: num(E(p.label + ' rest ready in', ['sensor'])),
  };
}

function renderHero() {
  const pit = num(E('Pit temperature', ['sensor'])), tgt = num(E('Pit target', ['number']));
  const link = val(E('Grill connected', ['binary_sensor'])), via = val(E('Grill link', ['sensor']));
  const lid = val(E('Lid', ['binary_sensor'])), fan = val(E('Fan', ['binary_sensor']));
  const cook = val(E('Cook active', ['binary_sensor'])) === 'on';
  put('pitbig', fmt(pit) + `<small>${esc(TU())} pit${tgt != null ? ' → ' + fmt(tgt) + esc(TU()) : ''}</small>`);
  const chips = [];
  if (link === 'on') chips.push(`<span class="chip ok">Grill via ${esc(via || 'link')}</span>`);
  else chips.push('<span class="chip bad">Grill not connected</span>');
  if (cook) chips.push('<span class="chip hot">Cooking</span>');

// How the app's changes reach the grill: Wi-Fi, Bluetooth (experimental), or not at all (and why).
function controlRow() {
  const conn = val(E('Grill connected', ['binary_sensor'])) === 'on', via = val(E('Grill link', ['sensor'])) || 'none';

  return `<div class="row"><span>Control</span><span class="r"><span class="chip ${cls}">${esc(txt)}</span>${via === 'bluetooth' && ble ? ' ' + EXP('Setting targets over Bluetooth is new on the 980: check the grill follows the first change.') : ''}</span></div>` +

}

function rangeBar(s, ai) {

  return `<div class="range" title="estimate range"><span class="band" style="left:${pc(s.lo)}%;width:${pc(s.hi) - pc(s.lo)}%"></span>
    <span class="mid" style="left:${pc(s.rem)}%"></span>${ai ? `<span class="ai" style="left:${pc(ai)}%" title="AI estimate (experimental)"></span>` : ''}</div>
    <div class="small muted" style="display:flex;justify-content:space-between"><span>now</span><span>${atTxt(s.lo)} – ${atTxt(s.hi)}</span></div>`;
}

// Temperature sensors in Home Assistant a slot can read (probe-like ones first; not alarms, not the smoker's own).
function haThermometers() {
  const all = H().all();
  return Object.keys(all).filter(id => {
    if (!id.startsWith('sensor.') || /^sensor\.smoker_/.test(id) || /alarm/.test(id)) return false;
    const a = all[id].attributes || {};
    return a.device_class === 'temperature' || /°[CF]/.test(a.unit_of_measurement || '');
  }).map(id => ({ id, name: (all[id].attributes || {}).friendly_name || id, probe: /probe|meat|food|grill/i.test(id + ' ' + ((all[id].attributes || {}).friendly_name || '')),
                  v: all[id].state, u: (all[id].attributes || {}).unit_of_measurement || '' }))
    .sort((a, b) => (b.probe - a.probe) || a.name.localeCompare(b.name));
}
function haPicker(n, chosen) {
  const def = (S(byName('Smoker external probe ' + n, ['sensor'])) || {}).attributes || {};
  const using = chosen || def.source || '';
  const list = haThermometers();
  const opt = t => `<option value="${esc(t.id)}" ${t.id === chosen ? 'selected' : ''}>${esc(t.name)}${isFinite(parseFloat(t.v)) ? ' · ' + fmt(parseFloat(t.v)) + esc(t.u) : ''}</option>`;
  return `<div class="row"><span class="small muted">Thermometer</span><select style="max-width:62%" onchange="act.extEntity(${n}, this.value)">
    <option value="" ${chosen ? '' : 'selected'}>${using && !chosen ? 'Default: ' + esc((list.find(t => t.id === using) || { name: using }).name) : 'Choose a sensor…'}</option>
    ${list.filter(t => t.probe).map(opt).join('')}${list.some(t => !t.probe) ? `<optgroup label="Other temperature sensors">${list.filter(t => !t.probe).map(opt).join('')}</optgroup>` : ''}
    ${chosen && !list.some(t => t.id === chosen) ? `<option value="${esc(chosen)}" selected>${esc(chosen)}</option>` : ''}</select></div>`;
}

// Each Food slot reads one thermometer: a grill probe, an H5198 probe (direct Bluetooth) or a Home Assistant entity.
function renderSources() {
  const rows = PROBES.map((p, i) => {
    const selE = E(p.label + ' probe', ['select']); if (!selE) return '';
    const st = S(selE), opts = (st.attributes && st.attributes.options) || [];
    const t = num(E(p.label + ' temperature', ['sensor']));
    const ha = st.state === 'Home Assistant';
    const txtE = byName('Smoker external probe ' + (i + 1) + ' entity', ['input_text']);
    return `<div class="row"><span>${esc(p.label)} <span class="muted small">${t != null ? fmt(t) + esc(TU()) : 'no reading'}</span></span>
      <span>${/^Wired/.test(st.state) ? EXP('Wired probes need the ADS1115 add-on and calibrating against a thermometer you trust.') + ' ' : ''}<select onchange="act.source('${p.key}', this.value)">${opts.map(o => `<option ${st.state === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></span></div>` +

// ---------------------------------------------------------------- journal
async function loadJournal(force) {
  if (!force && Date.now() - journal.loaded < 60000) return;
  journal.loaded = Date.now();
  const d = await H().api('GET', '/api/smoker/journal');
  journal.entries = d.entries || []; journal.draft = d.draft || { items: [], photos: [] };
  renderScan(); renderJournal();
}
const cToU = c => c == null ? null : (isF() ? c * 9 / 5 + 32 : c);
function renderJournal(force) {
  const list = [...journal.entries].reverse(), shown = journalAll ? list : list.slice(0, 6);
  const html = list.length ? shown.map(e => {
    const d = new Date(e.ended * 1000), w = e.weight_kg ? (isF() ? fmt(e.weight_kg * 2.2046, 1) + ' lb' : fmt(e.weight_kg, 1) + ' kg') : '';
    return `<div class="je"><div class="h"><span class="t">${esc(e.profile || 'Cook')}${w ? ' · ' + w : ''}</span>
        <span class="small muted">${dayLabel(d)} · ${esc(e.probe_name || '')}</span></div>
      <div class="chips"><span class="chip">${fmt(e.total_h, 1)} h total</span>${e.stall_h ? `<span class="chip warn">stall ${fmt(e.stall_h, 1)} h</span>` : ''}
        ${e.pit_c != null ? `<span class="chip hot">pit ${fmt(cToU(e.pit_c))}${esc(TU())}</span>` : ''}${e.ambient_c != null ? `<span class="chip">outside ${fmt(cToU(e.ambient_c))}${esc(TU())}</span>` : ''}
        ${e.wrapped ? '<span class="chip">wrapped</span>' : ''}</div>
      ${(e.items || []).length ? `<div class="small">${e.items.map(i => esc(i.name) + (i.weight_lb ? ' (' + fmt(i.weight_lb, 1) + ' lb)' : '')).join(' · ')}</div>` : ''}
      ${(e.photos || []).length ? `<div class="thumbs">${e.photos.map(n => `<img alt="package photo" src="${photo(n)}">`).join('')}</div>` : ''}
      <div class="row"><span class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="${(e.rating || 0) >= n ? 'on' : ''}" onclick="act.rate('${esc(e.id)}', ${n})" aria-label="${n} stars">★</button>`).join('')}</span>
        <button class="btn" onclick="act.compare('${esc(e.id)}')">Compare</button></div>
      <textarea id="jn-${esc(e.id)}" placeholder="Notes: bark, tenderness, what you'd change…" style="font-family:'Instrument Sans',system-ui,sans-serif;font-size:13.5px">${esc(e.notes || '')}</textarea>
      <div class="btns" style="margin-top:6px"><button class="btn" onclick="act.note('${esc(e.id)}')">Save notes</button></div></div>`;
  }).join('') + (list.length > shown.length ? `<div class="btns"><button class="btn" onclick="act.jall()">Show all ${list.length}</button></div>` : '')
    : '<div class="empty">No cooks yet. Each finished cook is added here automatically; rate it and add notes so the AI can learn from it.</div>';
  if (force) { const el = $('jlist'); if (el) el._h = null; }
  put('jlist', html);
}
// Overlay this cook's probe curve on up to 4 earlier cooks of the same protein (hours since start).
async function compareCooks(id) {
  const e = journal.entries.find(x => x.id === id); if (!e) return;
  const same = journal.entries.filter(x => x.id !== id && x.profile === e.profile).slice(-4);
  const cooks = [e, ...same], colors = ['var(--pit)', 'var(--food1)', 'var(--food2)', 'var(--g1)', 'var(--g3)'];
  const series = [];
  for (const [i, c] of cooks.entries()) {
    const label = PROBES.find(p => p.key === c.probe)?.label || 'Food 1';
    const eid = E(label + ' temperature', ['sensor']); if (!eid) continue;
    const r = await H().ws({ type: 'history/history_during_period', start_time: new Date(c.started * 1000).toISOString(),
      end_time: new Date(c.ended * 1000 + 600e3).toISOString(), entity_ids: [eid], minimal_response: true, no_attributes: true,
      significant_changes_only: false });
    const pts = (r[eid] || []).map(p => [((p.lu || p.lc) - c.started) / 3600, parseFloat(p.s)]).filter(p => isFinite(p[1]) && p[0] >= 0);
    series.push({ name: (i === 0 ? 'This cook · ' : '') + dayLabel(new Date(c.ended * 1000)) + (c.rating ? ' · ' + '★'.repeat(c.rating) : ''), color: colors[i], pts });
  }
  $('jcmp').style.display = '';
  $('jcmptitle').textContent = 'Compared with similar cooks (' + (e.profile || 'Cook') + ', hours since the start)';
  drawLines($('jchart'), series, $('jlegend'), 'h');
}
function drawLines(box, series, legend, xunit) {
  const W = box.clientWidth || 600, Hh = box.clientHeight || 280, L = 40, R = 10, T = 10, B = 24;
  let x0 = 0, x1 = 1, lo = Infinity, hi = -Infinity;
  series.forEach(s => s.pts.forEach(p => { x1 = Math.max(x1, p[0]); lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); }));
  if (!isFinite(lo)) { box.innerHTML = '<div class="empty">No recorded temperatures for these cooks (history may have been purged).</div>'; legend.innerHTML = ''; return; }
  const stepY = (hi - lo) > 80 ? 25 : 10; lo = Math.floor((lo - 2) / stepY) * stepY; hi = Math.ceil((hi + 2) / stepY) * stepY;
  const x = v => L + (W - L - R) * (v - x0) / (x1 - x0), y = v => T + (Hh - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi; v += stepY) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const xs = x1 > 12 ? 2 : 1;
  for (let v = 0; v <= x1; v += xs) g += `<text x="${x(v)}" y="${Hh - 6}" text-anchor="middle">${v}${xunit}</text>`;
  const lines = series.map(s => s.pts.length ? `<path d="${s.pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]) + ',' + y(p[1])).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>` : '').join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Cook comparison">${g}${lines}</svg>`;
  legend.innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
}

function renderLearn() {
  const n = num(E('Cooks learned', ['sensor'])), gf = num(E('Grill heat factor', ['sensor']));
  const last = val(byName('Smoker last cook summary', ['input_text']));
  put('learncard', `<h3>Learning</h3>
    <div class="row"><span>Cooks learned</span><span class="r">${fmt(n)}</span></div>
    <div class="row"><span>Grill heat factor</span><span class="r">${gf != null ? fmt(gf, 2) + '×' : '--'}</span></div>
    <p class="small muted" style="margin:8px 0">Each finished cook is saved on the controller (protein, weight, pit, weather, stall, total time).
      New cooks start from the most similar past cooks, then follow the live data.</p>
    ${last ? `<div class="small"><b>Last cook:</b> ${esc(last)}</div>` : ''}`);
}

function renderDiag() {
  const rows = [['Grill link', E('Grill link', ['sensor'])], ['Raw status frame', E('Raw status frame', ['sensor'])],
    ['Wi-Fi signal', E('Wi-Fi signal', ['sensor'])], ['Firmware', E('Firmware version', ['sensor'])], ['Uptime', E('Uptime', ['sensor'])],
    ['Grill IP address', E('Grill IP address', ['text'])]];
  const fw = E('Firmware', ['update']);
  const bridge = E('Bridge enabled', ['switch']);
  put('diag', rows.filter(r => r[1]).map(([l, e]) => `<div class="row"><span>${esc(l)}</span><span class="r">${esc(val(e) || '--')} ${esc(unitOf(e))}</span></div>`).join('') +
    (bridge ? `<div class="row"><span>Bridge enabled (off lets the Char-Griller app connect)</span><button class="tg ${val(bridge) === 'on' ? 'on' : ''}" onclick="act.toggle('${esc(bridge)}')"></button></div>` : '') +
    (fw && S(fw) ? `<div class="row"><span>Firmware update</span><span class="r">${S(fw).state === 'on' ? 'available: ' + esc(S(fw).attributes.latest_version) + ' (install from Settings)' : 'up to date'}</span></div>` : ''));
  put('foot', 'Smoker controller · ' + esc(val(E('Firmware version', ['sensor'])) || ''));
}

// ---------------------------------------------------------------- chart (inline SVG, follows the theme tokens)
let chartHours = 6, lastChart = 0, chartData = null;
async function loadChart() {
  const series = [['Pit', E('Pit temperature', ['sensor']), 'var(--pit)'], ['Pit target', E('Pit target', ['number']), 'var(--muted)']];
  PROBES.forEach(p => { const e = E(p.label + ' temperature', ['sensor']); if (e && num(e) != null) series.push([p.label, e, p.color]); });
  const ids = series.map(s => s[1]).filter(Boolean);
  if (!ids.length) return;
  const h = await hist(ids, chartHours);
  chartData = series.filter(s => s[1]).map(([name, eid, color]) => ({ name, color, dash: name === 'Pit target',
    pts: (h[eid] || []).map(p => [p.t, parseFloat(p.s)]).filter(p => isFinite(p[1])) }));
}
function drawChart() {
  const box = $('chart'); if (!box || !chartData) return;
  const W = box.clientWidth || 600, Hh = box.clientHeight || 280, L = 40, R = 10, T = 10, B = 24;
  const now = Date.now(), t0 = now - chartHours * 3600e3;
  let lo = Infinity, hi = -Infinity;
  chartData.forEach(s => s.pts.forEach(p => { if (p[0] >= t0) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } }));
  if (!isFinite(lo)) { box.innerHTML = '<div class="empty">No history yet.</div>'; return; }
  const span = Math.max(20, hi - lo), stepY = span > 200 ? 50 : span > 80 ? 25 : 10;
  lo = Math.floor((lo - 5) / stepY) * stepY; hi = Math.ceil((hi + 5) / stepY) * stepY;
  const x = t => L + (W - L - R) * (t - t0) / (now - t0), y = v => T + (Hh - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi; v += stepY) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const hstep = chartHours <= 6 ? 1 : chartHours <= 12 ? 2 : 4;
  for (let t = Math.ceil(t0 / 3600e3 / hstep) * hstep * 3600e3; t <= now; t += hstep * 3600e3)
    g += `<text x="${x(t)}" y="${Hh - 6}" text-anchor="middle">${new Date(t).toLocaleTimeString('en-US', { hour: 'numeric' })}</text>`;
  const lines = chartData.map(s => {
    const pts = s.pts.filter(p => p[0] >= t0 - 3600e3);
    if (!pts.length) return '';
    let d = '', last = null;
    pts.forEach(p => { const px = Math.max(L, x(p[0])), py = y(p[1]); if (last != null && s.dash) d += `L${px},${last}`; d += (d ? 'L' : 'M') + px + ',' + py; last = py; });
    d += `L${x(now)},${last}`;
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash ? 1.5 : 2.2}" ${s.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
  }).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Temperature history">${g}${lines}</svg>`;
  put('legend', chartData.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join(''));
}
function renderRange() {
  put('range', [3, 6, 12, 24].map(h => `<button aria-pressed="${h === chartHours}" onclick="act.range(${h})">${h}h</button>`).join(''));
}

// ---------------------------------------------------------------- loop
function render() {
  renderHero(); renderKpis(); renderRecs(); renderPit(); renderFuel();
  loadJournal().catch(e => console.warn('journal', e)); renderProgram(); renderAI(); renderProbes(); renderPlan(); renderLearn(); renderDiag(); renderRange();
  if (Date.now() - lastChart > 60000) { lastChart = Date.now(); loadChart().then(drawChart).catch(e => console.warn('history', e)); }
}
window.addEventListener('resize', () => drawChart());
live(render, 20000);
</script>
