install_package:
  name: Install the Smoker package
  description: >-
    Writes the Smoker package (helpers, automations, AI advisor, Home Assistant probe bridges) to
    /config/packages/smoker.yaml, filled in with your phone, AI task and weather. Run it again to update the package;
    your choices are kept. Restart Home Assistant afterwards.
  fields:
    notify:
      name: Phone
      description: >-
        The notify action for your phone, e.g. notify.mobile_app_my_phone (to find it, open Developer tools > Actions
        and type notify.mobile_app). Needed the first time; later runs keep it.
      example: notify.mobile_app_my_phone
      selector:
        text:
    ai_task:
      name: AI task entity
      example: ai_task.google_ai_task
      selector:
        entity:
          domain: ai_task
    weather:
      name: Weather entity
      example: weather.forecast_home
      selector:
        entity:
          domain: weather
    calendar:
      name: Calendar (optional)
      description: A timed event with "BBQ", "brisket", "smoker", "ribs"... in its title sets the serve-by time to the end of the event (block out the whole cook, e.g. 12 hours).
      example: calendar.family
      selector:
        entity:
          domain: calendar
    todo:
      name: To-do list (optional)
      description: Charcoal to buy and maintenance jobs are added here.
      example: todo.shopping_list
      selector:
        entity:
          domain: todo
set_device_pin:
  name: Set the device page PIN
  description: >-
    Sets, replaces or clears the PIN of the smoker controller's own web page, whenever (no need to power it off and on
    first, or to know the current PIN: Home Assistant holds the controller's key). 6 to 32 characters, not 123456 or
    111111; leave it empty to clear the PIN. Every browser that had unlocked the page has to unlock again. The
    controller's "Device page PIN" sensor shows the result. The PIN is never stored or logged by Home Assistant.
  fields:
    pin:
      name: PIN
      description: The new PIN (6 to 32 characters). Leave it empty to clear the PIN.
      example: "482913"
      selector:
        text:
          type: password
