# Monthly, one grouped pull request per ecosystem (Actions minutes are limited). Security updates still come as
# soon as an advisory is published. The pip locks are hash-pinned (.github/requirements/*.in -> *.txt).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: ["/.github/requirements", "/tests"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
