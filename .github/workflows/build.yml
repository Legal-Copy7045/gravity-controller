name: Build, test & release

# Every push builds the firmware and runs every test. Pushes to the default
# branch also, when VERSION has no release yet, create release v<VERSION> (tag
# included) with the firmware and the dashboard integration attached, and then
# publish that build's web installer + OTA manifest to GitHub Pages. A push that
# doesn't release leaves Pages (what devices and the installer see) as it is.
# (Adapted from the Magic-bHAnds project's workflow.)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the tag).
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  # (never on the default branch: a cancelled release run could leave a release without its attestation)
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  ESPHOME_VERSION: "2026.11.0"
  IS_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions match
        run: python3 .github/scripts/check_versions.py
      - name: Check the pages carry the current brand/ files
        run: python3 tools/brand_sync.py --check

# Keeps personal details out of this public repository (.github/scripts/privacy_guard.py): nothing is published
# (web installer, release) unless it passes. Two jobs:
#  - privacy (every push and pull request, no secrets): no-reply commit emails, credentials and image metadata, in
#    the tree and in every line the pushed commits add;
#  - privacy-denylist (default branch only): the same plus the private terms in the PRIVACY_DENYLIST secret. The
#    secret belongs in the `privacy` environment, which the owner restricts to the default branch (Settings ->
#    Environments -> privacy -> Deployment branches: the default branch only), so a workflow edited on another
#    branch can't read it. Release and Pages wait for both.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for personal details
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The default branch's copy of the guard runs (a branch can't weaken the check).
        run: |
          git show "origin/${DEFAULT_BRANCH}:.github/scripts/privacy_guard.py" > "$RUNNER_TEMP/privacy_guard.py"
          python3 "$RUNNER_TEMP/privacy_guard.py"

  privacy-denylist:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: privacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for personal details and private terms
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PRIVACY_DENYLIST_REQUIRED: "1"
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/${DEFAULT_BRANCH}:.github/scripts/privacy_guard.py" > "$RUNNER_TEMP/privacy_guard.py"
          python3 "$RUNNER_TEMP/privacy_guard.py"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core library tests (protocol, predictor, history, programs)
        run: make -C tests

  # Builds what gets published (the ESP32-S3 firmware and the web installer) with ESPHome alone: the test tools
  # below (aioesphomeapi, Playwright, a browser) run in their own job, so they can't touch the published files.
  # The compile runs third-party build code (PlatformIO/ESP-IDF scripts, managed components), so it never sees the
  # real signing key: it signs with a throwaway key made for the run, and the `firmware` job below signs the unsigned
  # app it leaves (gravity980-unsigned.bin) with the real key, in a job that runs nothing but espsecure and esptool.
  firmware-build:
    needs: versions
    runs-on: ubuntu-latest
    # The sha256 of every file it hands to the signing job, as a job output (another job can't rewrite this job's
    # outputs, but it could replace an artifact): `firmware` checks them before it signs anything.
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Its own cache, never shared with firmware-tests (which runs third-party test tools): a cache that job saved
      # can't end up in the published firmware. Restored and saved separately so it's saved only after a good build.
      # A release build (the default branch) uses no cache at all: any job running on the default branch could have
      # written one under this name first, and the release is signed with the real key.
      - name: Restore the ESPHome toolchain cache (this job's own; not for a release)
        id: fwcache
        if: env.IS_DEFAULT != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-release-${{ env.ESPHOME_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/requirements/firmware.txt') }}
      - name: Install ESPHome (hash-pinned, .github/requirements/firmware.txt)
        run: |
          grep -qx "esphome==${ESPHOME_VERSION}" .github/requirements/firmware.in || { echo "::error::ESPHOME_VERSION and .github/requirements/firmware.in differ: regenerate the lock"; exit 1; }
          python -m pip install --require-hashes -r .github/requirements/build-tools.txt
          python -m pip install --require-hashes --no-build-isolation -r .github/requirements/firmware.txt
      - name: Throwaway signing key for the compile (the real one never comes near it)
        working-directory: firmware
        run: |
          umask 077
          espsecure generate-signing-key --version 2 --scheme rsa3072 signing_key.pem >/dev/null
      - name: Compile ESP32-S3 firmware
        working-directory: firmware
        run: |
          trap 'rm -f signing_key.pem' EXIT
          esphome compile gravity980-bridge.yaml
      - name: Save the ESPHome toolchain cache
        if: env.IS_DEFAULT != 'true' && steps.fwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-release-${{ env.ESPHOME_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/requirements/firmware.txt') }}
      - name: Validate the controller without Home Assistant (base.yaml alone, no API)
        run: esphome config tests/configs/no-ha.yaml
      - name: Fingerprints of the files for the signing job
        id: sums
        working-directory: firmware/.esphome/build/gravity980/build
        run: |
          sums=$(sha256sum gravity980-unsigned.bin bootloader/bootloader.bin partition_table/partition-table.bin \
                 ota_data_initial.bin flasher_args.json | awk '{print $1 ":" $2}' | tr '\n' ' ')
          echo "sums=$sums" >> "$GITHUB_OUTPUT"
          echo "$sums"
      - name: Upload the unsigned app and the flash parts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-unsigned
          path: |
            firmware/.esphome/build/gravity980/build/gravity980-unsigned.bin
            firmware/.esphome/build/gravity980/build/bootloader/bootloader.bin
            firmware/.esphome/build/gravity980/build/partition_table/partition-table.bin
            firmware/.esphome/build/gravity980/build/ota_data_initial.bin
            firmware/.esphome/build/gravity980/build/flasher_args.json
          if-no-files-found: error

  # Signs the app and assembles the update image, the installer's factory image and the site. Only espsecure and
  # esptool run here (hash-pinned), with the key on disk for the signing step alone.
  firmware:
    needs: firmware-build
    runs-on: ubuntu-latest
    # Fingerprints of what it publishes (the signed images, and the Pages bundle), checked by release and deploy.
    outputs:
      bins: ${{ steps.pubsums.outputs.bins }}
      site: ${{ steps.pubsums.outputs.site }}
    # The firmware signing key (OTA_SIGNING_KEY) is in the release-signing environment, which only the default branch
    # can use. Every other build is signed with a throwaway key made for that run (never published).
    environment: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && 'release-signing' || 'unsigned-build' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # esptool and its own dependencies only (.github/requirements/sign.txt), wheels except esptool itself (built with
      # the hash-pinned setuptools), in a fresh venv: as little third-party code as possible runs next to the key.
      - name: Install esptool (hash-pinned, .github/requirements/sign.txt)
        run: |
          python -m venv "$RUNNER_TEMP/sign"
          "$RUNNER_TEMP/sign/bin/pip" install --require-hashes -r .github/requirements/build-tools.txt
          "$RUNNER_TEMP/sign/bin/pip" install --require-hashes --no-deps --no-build-isolation --only-binary :all: \
            --no-binary esptool -r .github/requirements/sign.txt
          # setuptools was only needed to build esptool: gone before the key exists (its .pth hook runs at every start)
          "$RUNNER_TEMP/sign/bin/pip" uninstall -y setuptools
          echo "$RUNNER_TEMP/sign/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware-unsigned
          path: build
      # The files are the ones firmware-build made (its job output): nothing else gets signed.
      - name: Check the fingerprints before signing
        env:
          SUMS: ${{ needs.firmware-build.outputs.sums }}
        run: |
          [ -n "$SUMS" ] || { echo "::error::firmware-build gave no fingerprints"; exit 1; }
          n=0
          for e in $SUMS; do
            want="${e%%:*}"; f="${e#*:}"
            got=$(sha256sum "build/$f" | cut -d' ' -f1) || { echo "::error::missing build/$f"; exit 1; }
            [ "$got" = "$want" ] || { echo "::error::build/$f isn't the file firmware-build made"; exit 1; }
            n=$((n + 1))
          done
          [ "$n" = 5 ] || { echo "::error::expected 5 fingerprints, got $n"; exit 1; }
          echo "all $n files match"
      # Released firmware is signed, and controllers only accept updates signed with the same key
      # (firmware/gravity980-bridge.yaml, signed_ota_verification). The key exists only for this step.
      - name: Sign the app
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          umask 077
          trap 'rm -f signing_key.pem' EXIT
          if [ "$IS_DEFAULT" = "true" ]; then
            [ -n "$OTA_SIGNING_KEY" ] || { echo "::error::OTA_SIGNING_KEY isn't available: add it to the release-signing environment"; exit 1; }
            printf '%s\n' "$OTA_SIGNING_KEY" > signing_key.pem
          else
            espsecure generate-signing-key --version 2 --scheme rsa3072 signing_key.pem >/dev/null
          fi
          espsecure sign-data --version 2 --keyfile signing_key.pem --output build/gravity980.bin build/gravity980-unsigned.bin
          espsecure verify-signature --version 2 --keyfile signing_key.pem build/gravity980.bin
      - name: Update image and factory image (as ESPHome makes them)
        run: |
          cp build/gravity980.bin build/firmware.ota.bin
          python3 - <<'PY'
          import json, subprocess
          fa = json.load(open("build/flasher_args.json"))
          parts = []
          for addr, f in sorted(fa["flash_files"].items(), key=lambda kv: int(kv[0], 16)):
              parts += [addr, "build/" + f]
          subprocess.run(["esptool", "--chip", fa["extra_esptool_args"]["chip"], "merge-bin", "--flash-size", "16MB",
                          "-o", "build/firmware.factory.bin"] + parts, check=True)
          PY
      - name: Assemble site
        run: python3 .github/scripts/make_site.py _site build firmware/base.yaml
      - name: Upload Pages artifact
        if: env.IS_DEFAULT == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: _site/firmware/*.bin
      - name: Fingerprints of what's published
        id: pubsums
        run: |
          bins=$(cd _site/firmware && sha256sum *.bin | awk '{print $1 ":" $2}' | tr '\n' ' ')
          echo "bins=$bins" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/artifact.tar" ]; then
            echo "site=$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

  # Provenance for the published firmware, on the default branch only (the only job besides release that can mint
  # an OIDC token for attestations).
  attest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware
          path: firmware-bin
      - name: Attest the published firmware
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: firmware-bin/*.bin

  # Four side by side (about 15 min instead of 40 one after another): the end-to-end test and the device page, and the
  # failure scenarios in their three independent groups (tests/e2e_scenarios.py, SCENARIO_GROUP).
  firmware-tests:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [e2e-and-page, scenarios-A, scenarios-B, scenarios-C]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Its own cache key (esphome-tests-...): never the firmware job's.
      - name: Cache ESPHome toolchain (tests only)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-tests-${{ env.ESPHOME_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/requirements/firmware-tests.txt') }}
      - name: Install ESPHome and the test tools (hash-pinned, .github/requirements/firmware-tests.txt)
        run: |
          python -m pip install --require-hashes -r .github/requirements/build-tools.txt
          python -m pip install --require-hashes --no-build-isolation -r .github/requirements/firmware-tests.txt
      - name: Compile native test build
        working-directory: tests
        run: esphome compile host-bridge.yaml
      - name: End-to-end test against the simulated grill
        if: matrix.part == 'e2e-and-page'
        run: python3 tests/e2e.py
      - name: Failure scenarios (${{ matrix.part }})
        if: startsWith(matrix.part, 'scenarios-')
        env:
          SCENARIO_GROUP: ${{ matrix.part == 'scenarios-A' && 'A' || matrix.part == 'scenarios-B' && 'B' || 'C' }}
        run: python3 tests/e2e_scenarios.py
      - name: Device web page (firmware/device-ui) in Chromium against the host build
        if: matrix.part == 'e2e-and-page'
        run: |
          python3 -m playwright install --with-deps chromium
          python3 tests/webui_e2e.py _device_ui_screens
      - name: Upload device page screenshots
        if: always() && matrix.part == 'e2e-and-page'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-page-screenshots
          path: _device_ui_screens/*.png
          if-no-files-found: ignore

  home-assistant:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"   # (Home Assistant 2026.11, as owners run it, needs 3.14)
      - name: Install Home Assistant and Playwright (hash-pinned, .github/requirements/ha-tests.txt)
        run: |
          # (Home Assistant 2026.11 runs only in a virtual environment or a container)
          python -m venv "$RUNNER_TEMP/ha"
          echo "$RUNNER_TEMP/ha/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ha/bin/python" -m pip install --require-hashes -r .github/requirements/ha-tests.txt
          export PATH="$RUNNER_TEMP/ha/bin:$PATH"
          python -m playwright install --with-deps chromium
      - name: Check the HA package and integration load
        run: python3 tests/ha_check.py
      - name: Render the package's templates with Home Assistant
        run: python3 tests/ha_templates.py
      - name: Dashboard render test
        run: python3 tests/render_page.py _screens
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: _screens/*.png

  integration:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # (The lock lists every package, one of them newer than Home Assistant pins for a known vulnerability:
      # .github/requirements/integration-overrides.txt. So no dependency resolution here, and a virtual environment:
      # Home Assistant 2026.10+ runs only in one.)
      - name: Install the Home Assistant test framework (hash-pinned, .github/requirements/integration-tests.txt)
        run: |
          python -m venv "$RUNNER_TEMP/ha"
          echo "$RUNNER_TEMP/ha/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ha/bin/python" -m pip install --no-deps --require-hashes -r .github/requirements/integration-tests.txt
      - name: Integration tests (journal, photo identification, voice)
        run: python -m pytest -q

  # Pages (the web installer and the OTA manifest devices poll) is published only with a release: after the release
  # job created v<VERSION> in this run (or on a re-run of the commit that release was made from), so the manifest
  # never names a tag that doesn't exist and a push that doesn't release changes nothing devices see.
  deploy:
    if: needs.release.outputs.publish == 'true'
    needs: [privacy, privacy-denylist, firmware, attest, firmware-tests, unit-tests, home-assistant, integration, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages bundle is the one the signing job made (its fingerprint, a job output), not a replacement.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: github-pages
          path: pages
      - name: Check the Pages bundle's fingerprint
        env:
          WANT: ${{ needs.firmware.outputs.site }}
        run: |
          [ -n "$WANT" ] || { echo "::error::the firmware job gave no fingerprint for the Pages bundle"; exit 1; }
          got=$(sha256sum pages/artifact.tar | cut -d' ' -f1)
          [ "$got" = "$WANT" ] || { echo "::error::the Pages bundle isn't the one the firmware job made"; exit 1; }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: [privacy, privacy-denylist, firmware, firmware-tests, unit-tests, home-assistant, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      # true when Pages should publish this build: the release was created now, or already points at this commit.
      publish: ${{ steps.rel.outputs.created == 'true' || steps.rel.outputs.same_commit == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware
          path: firmware-bin
      # The images are the ones the signing job made (its job output), not replacements.
      - name: Check the firmware's fingerprints
        env:
          SUMS: ${{ needs.firmware.outputs.bins }}
        run: |
          [ -n "$SUMS" ] || { echo "::error::the firmware job gave no fingerprints"; exit 1; }
          for e in $SUMS; do
            want="${e%%:*}"; f="${e#*:}"
            got=$(sha256sum "firmware-bin/$f" | cut -d' ' -f1) || { echo "::error::missing firmware-bin/$f"; exit 1; }
            [ "$got" = "$want" ] || { echo "::error::firmware-bin/$f isn't the image the firmware job signed"; exit 1; }
          done
          [ "$(ls firmware-bin/*.bin | wc -l)" = "$(echo $SUMS | wc -w)" ] || { echo "::error::unexpected files"; exit 1; }
      - name: Create the release for VERSION if it doesn't exist
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump VERSION to release again (Pages stays as it is)."
            echo "created=false" >> "$GITHUB_OUTPUT"
            # A re-run of the commit the release was made from may still publish Pages (e.g. a failed deploy).
            T="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)"
            if [ "$T" = "$GITHUB_SHA" ]; then echo "same_commit=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          python3 .github/scripts/check_versions.py "$TAG"
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          (cd custom_components && zip -qr "../smoker-integration-$V.zip" smoker)
          # The same files for HACS (hacs.json zip_release/filename): a fixed name, the integration's files at the
          # zip's root, as HACS unpacks it straight into custom_components/smoker.
          (cd custom_components/smoker && zip -qr "../../smoker-integration.zip" . -x '__pycache__/*' '*/__pycache__/*')
          (cd homeassistant/packages && zip -qr "../../smoker-ha-package-$V.zip" smoker.yaml)
          for f in firmware-bin/*.bin; do cp "$f" "./$(basename "${f%.bin}")-$V.bin"; done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
      # Attested before the release exists, so a release never goes out without its provenance.
      - name: Attest build provenance
        if: steps.rel.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            smoker-integration-*.zip
            smoker-integration.zip
            smoker-ha-package-*.zip
            *.bin
      - name: Publish the release
        if: steps.rel.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          V: ${{ steps.rel.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Smoker bridge $V" \
            --notes-file notes.md "smoker-integration-$V.zip" smoker-integration.zip "smoker-ha-package-$V.zip" ./*-$V.bin
