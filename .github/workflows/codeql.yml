name: CodeQL

# Code scanning once a week and on demand (Actions minutes are limited): not on every push or pull request.
# Replaces GitHub's "default setup" for CodeQL, which the owner switches off (Settings -> Code security -> CodeQL
# analysis -> Disable), since GitHub won't take results from both.
on:
  schedule:
    - cron: "41 8 * * 3"   # Wednesdays 08:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
