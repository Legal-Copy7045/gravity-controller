# Weekly and on demand only (STANDARD.md 1.5), through the standard's reusable workflow. GitHub's CodeQL "default
# setup" is switched off (Settings -> Code security -> CodeQL analysis), since GitHub won't take results from both.
name: CodeQL
on:
  schedule:
    - cron: "17 3 * * 0"   # Sunday 03:17 UTC: two hours after this project's weekly CI slot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: Legal-Copy7045/project-standards/.github/workflows/codeql.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with:
      languages: '["actions", "c-cpp", "javascript-typescript", "python"]'
