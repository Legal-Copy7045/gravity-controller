name: Community cooks (nightly)

# Adds the shared cooks the Worker has released (held back 1-3 days after they were sent) to the open dataset on the
# community-data branch and rebuilds aggregates.json. See docs/sharing.md.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false
      - name: Check out (or start) the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cd data
          if git ls-remote --exit-code --heads origin community-data >/dev/null; then
            git checkout --quiet community-data
          else
            git checkout --quiet --orphan community-data
            git rm -rfq . || true
          fi
      - name: Add released cooks, rebuild the averages
        run: |
          URL=$(python3 -c "import re;print(re.search(r'SHARE_URL = \"([^\"]+)\"', open('main/custom_components/smoker/sharing.py').read()).group(1))")
          python3 main/.github/scripts/community_build.py data --worker "$URL"
      - name: Publish
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit --quiet -m "Community cooks: $(wc -l < cooks.jsonl) shared"
          git push --quiet origin community-data
