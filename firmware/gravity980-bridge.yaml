# Prebuilt firmware (built by GitHub Actions, installed from the GitHub Pages
# installer, updated over the air). Uses the components from this checkout.
packages:
  core: !include core.yaml

external_components:
  - source:
      type: local
      path: ../components

# A statement indented as if it were inside an `if` without braces fails the build (it would run unconditionally:
# the 1.0.0 device page's plan/fuel/journal/sharing routes were broken by exactly that).
esphome:
  platformio_options:
    build_flags:
      - -Werror=misleading-indentation

# Signed updates: the released firmware is signed at build time with the project's key (CI writes it to
# firmware/signing_key.pem for the compile only), and a controller running it only accepts updates signed with the
# same key, and never an older version (downgrade protection). No eFuses are burned: flashing over USB from the web
# installer still works as before. Building your own? `espsecure generate-signing-key --version 2 --scheme rsa3072
# firmware/signing_key.pem` makes a key of your own (keep it: updates to your controller then need it).
esp32:
  framework:
    advanced:
      signed_ota_verification:
        signing_key: signing_key.pem
      enable_ota_downgrade_protection: true
