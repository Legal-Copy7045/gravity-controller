# Developer tool, NOT part of the released firmware: capture mode (docs/protocol.md, "Capturing the app's
# commands"). For 10 minutes the controller poses as a grill over Bluetooth so the Char-Griller app connects to it,
# and records every byte the app writes. Nothing is sent to the real grill. Add to a build of your own:
#   packages:
#     core: !include core.yaml
#     dev_capture: !include dev-capture.yaml
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(local).set_capture([]() { return id(grill).capture_json(); }, []() { id(grill).capture_clear(); });

text_sensor:
  - platform: gravity980
    captured_commands:
      name: Captured app commands

button:
  - platform: gravity980
    clear_capture:
      name: Clear captured app commands

switch:
  - platform: gravity980
    app_capture:
      name: Capture the app's commands
