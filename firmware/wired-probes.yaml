# Optional: up to four wired NTC meat probes on the controller itself (no grill, Govee or Home Assistant needed).
#
# Hardware (see hardware/BOM.md): an ADS1115 16-bit ADC on I2C, and per probe a 2.5 mm mono jack wired as a divider:
#
#     3.3 V ──[ 100 kΩ 0.1 % ]──┬── ADS1115 A0 (A1, A2, A3 for probes 2-4)
#                               │
#                             probe (NTC)
#                               │
#                              GND
#
# Add it to your device YAML (ESPHome dashboard build) next to the main package:
#
#   packages:
#     smoker: github://Legal-Copy7045/gravity-controller/firmware/core.yaml@main
#     wired: github://Legal-Copy7045/gravity-controller/firmware/wired-probes.yaml@main
#
# Then pick "Wired probe N" as a slot's source (Food N probe). Every slot can use any wired probe.
#
# Calibration: NTC food probes differ. The defaults suit common 100 kΩ (B 3950) probes. For your probes, set
# wired_r25/wired_b, or better, measure three points (ice water 0 °C, room temperature, boiling water ≈100 °C at sea
# level) and use ESPHome's three-point `calibration:` form instead (see docs/install.md). Until calibrated, treat the
# readings as experimental and check them against a known-good thermometer.

substitutions:
  wired_sda: GPIO8
  wired_scl: GPIO9
  wired_address: "0x48"
  wired_reference_resistor: 100kOhm   # the fixed resistor in each divider
  wired_r25: 100kOhm                  # probe resistance at 25 °C
  wired_b: "3950"                     # probe B constant
  wired_supply: "3.3"                 # divider supply voltage (V)

i2c:
  id: wired_i2c
  sda: ${wired_sda}
  scl: ${wired_scl}
  frequency: 400kHz

ads1115:
  - id: wired_adc
    i2c_id: wired_i2c
    address: ${wired_address}
    continuous_mode: true

sensor:
  # ---- probe 1 ----
  - platform: ads1115
    ads1115_id: wired_adc
    id: wired_v1
    multiplexer: A0_GND
    gain: 4.096
    update_interval: 2s
    internal: true
  - platform: resistance
    id: wired_r1
    sensor: wired_v1
    configuration: DOWNSTREAM
    resistor: ${wired_reference_resistor}
    reference_voltage: ${wired_supply}V
    internal: true
  - platform: ntc
    id: wired_ntc1
    sensor: wired_r1
    calibration:
      b_constant: ${wired_b}
      reference_temperature: 25°C
      reference_resistance: ${wired_r25}
    internal: true
    on_value:
      # Open jack (no probe) or a shorted lead reads far outside a food probe's range: that's no reading.
      - sensor.template.publish:
          id: wired_probe1
          state: !lambda |-
            return (x > -20.0f && x < 320.0f) ? x : NAN;
  # ---- probe 2 ----
  - platform: ads1115
    ads1115_id: wired_adc
    id: wired_v2
    multiplexer: A1_GND
    gain: 4.096
    update_interval: 2s
    internal: true
  - platform: resistance
    id: wired_r2
    sensor: wired_v2
    configuration: DOWNSTREAM
    resistor: ${wired_reference_resistor}
    reference_voltage: ${wired_supply}V
    internal: true
  - platform: ntc
    id: wired_ntc2
    sensor: wired_r2
    calibration:
      b_constant: ${wired_b}
      reference_temperature: 25°C
      reference_resistance: ${wired_r25}
    internal: true
    on_value:
      - sensor.template.publish:
          id: wired_probe2
          state: !lambda |-
            return (x > -20.0f && x < 320.0f) ? x : NAN;
  # ---- probe 3 ----
  - platform: ads1115
    ads1115_id: wired_adc
    id: wired_v3
    multiplexer: A2_GND
    gain: 4.096
    update_interval: 2s
    internal: true
  - platform: resistance
    id: wired_r3
    sensor: wired_v3
    configuration: DOWNSTREAM
    resistor: ${wired_reference_resistor}
    reference_voltage: ${wired_supply}V
    internal: true
  - platform: ntc
    id: wired_ntc3
    sensor: wired_r3
    calibration:
      b_constant: ${wired_b}
      reference_temperature: 25°C
      reference_resistance: ${wired_r25}
    internal: true
    on_value:
      - sensor.template.publish:
          id: wired_probe3
          state: !lambda |-
            return (x > -20.0f && x < 320.0f) ? x : NAN;
  # ---- probe 4 ----
  - platform: ads1115
    ads1115_id: wired_adc
    id: wired_v4
    multiplexer: A3_GND
    gain: 4.096
    update_interval: 2s
    internal: true
  - platform: resistance
    id: wired_r4
    sensor: wired_v4
    configuration: DOWNSTREAM
    resistor: ${wired_reference_resistor}
    reference_voltage: ${wired_supply}V
    internal: true
  - platform: ntc
    id: wired_ntc4
    sensor: wired_r4
    calibration:
      b_constant: ${wired_b}
      reference_temperature: 25°C
      reference_resistance: ${wired_r25}
    internal: true
    on_value:
      - sensor.template.publish:
          id: wired_probe4
          state: !lambda |-
            return (x > -20.0f && x < 320.0f) ? x : NAN;
