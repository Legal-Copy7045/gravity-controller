# The Home Assistant side of the controller: the API (actions the HA package and dashboard call), Home Assistant's
# clock, weather and thermometers, the Bluetooth proxy, and the events Home Assistant listens for.
# Included by core.yaml together with base.yaml; see docs/standalone.md for running without it.

api:
  # Home Assistant sets the encryption key when you add the device.
  encryption: {}
  # Keep running (and cooking) when Home Assistant is away: alarms still go out through ntfy. The default would
  # reboot the controller after 15 minutes without Home Assistant, dropping the grill link and the cook's estimates.
  reboot_timeout: 0s
  actions:
    - action: load_program
      variables:
        program: string
      then:
        - lambda: id(smoker).load_program(program);
    - action: start_program
      then:
        - lambda: id(smoker).start_program();
    - action: pause_program
      then:
        - lambda: id(smoker).pause_program();
    - action: resume_program
      then:
        - lambda: id(smoker).resume_program();
    - action: skip_step
      then:
        - lambda: id(smoker).skip_step();
    - action: stop_program
      then:
        - lambda: id(smoker).stop_program();
    # Protocol research: send one FF <id> <hi> <lo> command (only while the "Command tests" switch is on; never
    # 0x01/0x04/0x05). The outcome goes to the "Command test" text sensor and the log.
    - action: test_command
      variables:
        command_id: int
        value: int
      then:
        - lambda: |-
            std::string why = id(grill).send_test_command(command_id, value);
            char b[160];
            snprintf(b, sizeof b, "%s FF %02X %02X %02X%s%s", why.empty() ? "sent" : "refused", command_id & 0xFF,
                     (value >> 8) & 0xFF, value & 0xFF, why.empty() ? "" : ": ", why.c_str());
            id(test_result).publish_state(b);
    - action: set_pit_target
      variables:
        value: float
      then:
        - lambda: id(grill).request_target(esphome::gravity980::PROBE_PIT, value);
    # Fuel gauge: levels in % of a full hopper.
    - action: fuel_level          # "I looked: it's at N %" (no fuel added since the last entry)
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_level(percent);
    - action: fuel_refilled       # "topped up, now at N %"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_refilled(percent);
    - action: fuel_added          # "added N % of a hopper"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_added(percent);
    - action: fuel_end            # "cook over, N % left"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_end(percent);
    # Hourly outdoor forecast from Home Assistant (minutes from now, temperature in the weather unit).
    - action: set_forecast
      variables:
        minutes: float[]
        temps: float[]
      then:
        - lambda: if (!id(local).weather_here()) id(smoker).set_forecast(minutes, temps);
    # Context for the HA AI advisor: fires esphome.smoker_context with live state + cook history.
    - action: request_context
      then:
        - if:
            condition:
              lambda: return id(local).event_secret().empty();
            then:
              - homeassistant.event:
                  event: esphome.smoker_context
                  data:
                    state: !lambda return id(smoker).state_json();
                    history: !lambda return id(smoker).history_json();
            else:
              - homeassistant.event:
                  event: esphome.smoker_context
                  data:
                    state: !lambda return id(smoker).state_json();
                    history: !lambda return id(smoker).history_json();
                    secret: !lambda return id(local).event_secret();
    # The Smoker integration's secret (it sets it on every connection): every event the controller fires carries it,
    # so the integration can tell them from forged ones. Kept in flash; never shown or logged. Empty clears it.
    - action: set_event_secret
      variables:
        secret: string
      then:
        - lambda: id(local).set_event_secret(secret);

time:
  - platform: homeassistant
    id: ha_time

# Home Assistant Bluetooth proxy: the smoker controller is the closest radio to
# Bluetooth thermometers at the grill (Govee H5198, etc.).
bluetooth_proxy:
  active: true
  connection_slots: 3

sensor:
  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
    on_value:
      - lambda: if (!id(local).weather_here()) id(outdoor_temp).publish_state(x);
  - platform: homeassistant
    id: ha_outdoor_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
    on_value:
      - lambda: if (!id(local).weather_here()) id(outdoor_humidity).publish_state(x);
  - platform: homeassistant
    id: ha_outdoor_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
    on_value:
      - lambda: if (!id(local).weather_here()) id(outdoor_wind).publish_state(x);
  - platform: homeassistant
    id: ha_ext_probe1
    entity_id: sensor.smoker_external_probe_1
    internal: true
    on_value:
      - sensor.template.publish:
          id: ext_probe1
          state: !lambda return x;
  - platform: homeassistant
    id: ha_ext_probe1_target
