cook_assistant:
  time_id: ha_time
  on_notify:
    # Via Home Assistant (its package forwards to your phone), when the device page's route says so.
    - if:
        condition:
          lambda: return id(local).send_via_ha();
        then:
          - if:
              condition:
                lambda: return id(local).event_secret().empty();
              then:
                - homeassistant.event:
                    event: esphome.smoker_notify
                    data:
                      title: !lambda return title;
                      message: !lambda return message;
                      priority: !lambda return priority;
                      tag: !lambda return tag;
              else:
                - homeassistant.event:
                    event: esphome.smoker_notify
                    data:
                      title: !lambda return title;
                      message: !lambda return message;
                      priority: !lambda return priority;
                      tag: !lambda return tag;
                      secret: !lambda return id(local).event_secret();
  on_cook_complete:
    - if:
        condition:
          lambda: return id(local).event_secret().empty();
        then:
          - homeassistant.event:
              event: esphome.smoker_cook_complete
              data:
                summary: !lambda return json;
        else:
          - homeassistant.event:
              event: esphome.smoker_cook_complete
              data:
                summary: !lambda return json;
                secret: !lambda return id(local).event_secret();
