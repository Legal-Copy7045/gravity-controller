# Gravity 980 smoker controller: everything that works without Home Assistant (docs/standalone.md).
#
# core.yaml = this + home-assistant.yaml (the prebuilt firmware and docs/install.md use core.yaml). A controller
# that will never see Home Assistant can include this file alone. Override any substitution.

substitutions:
  project_version: "1.2.0"
  name: gravity980
  friendly_name: Smoker
  temperature_unit: "F"            # F or C: the controller's own unit (HA converts for display anyway)
  weather_entity: weather.forecast_home
  weather_temperature_unit: "F"    # the unit your HA weather entity reports (HA unit system)
  wind_speed_unit: "mph"           # mph, km/h or m/s
  ntfy_server: https://ntfy.sh
  update_manifest: https://legal-copy7045.github.io/gravity-controller/firmware/manifest.json
  # Each food slot (Food 1-6) can read a grill probe, an H5198 probe (direct Bluetooth), or a Home Assistant
  # entity: pick it per slot with "Food N probe". The HA package maps entities onto sensor.smoker_external_probe_N
  # (and the thermometer's own alarm, when it has one, onto sensor.smoker_external_probe_N_target).
  # Defaults: Food 1-2 = the grill's probes, Food 3-6 = Home Assistant (helpers 3-6).

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.11.0   # improv_ble, keyless API encryption
  project:
    name: legal-copy7045.gravity980-bridge
    version: ${project_version}
  on_boot:
    priority: -100
    then:
      # Upgrade: the ntfy topic moves from a (readable) text entity into the controller's write-only secrets. The old
      # field is emptied whatever happens (a topic too long to move is dropped: set it again on the device page).
      - lambda: |-
          id(local).migrate_ntfy_topic(id(ntfy_topic).state);
          if (!id(ntfy_topic).state.empty())
            id(ntfy_topic).make_call().set_value("").perform();

# Flash encryption and secure boot are NOT enabled: both burn eFuses for good (a controller can then only take
# images signed/encrypted with keys you must keep, and a mistake bricks it). Without them, anyone holding the board
# can read its flash over USB: the Wi-Fi password, the API key, the device page's PIN hash and the write-only keys
# (notifications, AI). Treat a controller you give away or lose like those secrets: change them. ESP-IDF's NVS
# encryption needs one or the other eFuse too (flash encryption, or an HMAC key burned in), so it isn't used either.
esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

ota:
  # Updates come from this project's GitHub release only (http_request, the Firmware update entity): the manifest and
  # the image are fetched over HTTPS from GitHub Pages (certificate checked) and the image is checked against the MD5
  # in that same manifest. Release builds (gravity980-bridge.yaml) are also signed: from 1.1.0 a controller installs only
  # images signed with the project's key, and never an older version. No LAN upload: an
  # open ESPHome OTA port would let anyone on the Wi-Fi flash their own firmware and skip the page's PIN. Building
  # in the ESPHome dashboard? Add `- platform: esphome` with a `password:` in your own YAML (docs/install.md).
  - platform: http_request

http_request:
  timeout: 15s

debug:
  update_interval: 60s

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${update_manifest}
    update_interval: 6h

# Automatic updates (the "Automatic updates" switch, off by default): an update is installed only while the controller
# has been idle for an hour, meaning the grill is not connected, no cook session is active and no program is running or
# paused. A cook that loses the grill stays active for 20 minutes after the pit reads cold, so a dropped link mid-cook
# doesn't count as idle. The check is made again just before installing; after a failed attempt it waits 6 hours.
# The image must carry the project's signature and be newer, or the controller refuses it and keeps running.

wifi:
  # A grill at the edge of Wi-Fi: keep trying rather than rebooting (the BLE link to the grill can carry on).
  reboot_timeout: 0s
  ap:
    # Open setup hotspot (after 90 s without Wi-Fi) with an unauthenticated setup portal, so it only comes up when
    # it's needed: a new controller, or one that can't reach its Wi-Fi since it started (then only within the
    # provisioning window below). Once it has joined the Wi-Fi it never comes back until a restart: knocking the
    # controller off the Wi-Fi doesn't hand its setup to whoever is nearby.
    ssid: "${friendly_name} setup"
  on_connect:
    - logger.log: Wi-Fi connected
    - lambda: wifi::global_wifi_component->set_ap_timeout(0);   # 0 = no fallback hotspot (until a restart)

# Setup window (ESPHome's provisioning): the open setup hotspot, Improv and Home Assistant adopting the controller
# (the native API starts without a key; Home Assistant sets one when you add the device) work only in the first 15
# minutes after the controller is powered on. Once Home Assistant has set its key the API needs it. While it has no
# key, the window closes at once after a software restart (Restart, a crash, an update: anyone on the Wi-Fi can
# cause one) and as soon as the device page's first PIN is set (components/standalone). Missed it? Power the
# controller off and on and add it within 15 minutes.
provisioning:
  timeout: 15min

captive_portal:
improv_serial:
improv_ble:
  # Wi-Fi setup over Bluetooth only after a press of the controller's BOOT button (someone at the grill).
  authorizer: boot_button

web_server:
  port: 80
  version: 3
  ota: false   # no firmware upload from the device web page on the LAN
  include_internal: true   # the Wi-Fi password field is internal (kept out of Home Assistant) but set from this page
  log: false   # the controller's log isn't for anyone on the Wi-Fi (Home Assistant and USB still have it)
  # The smoker's own page (firmware/device-ui), stored gzipped in flash and served as /0.js and /0.css, so
  # http://gravity980.local works with no internet. An empty js_url drops ESPHome's hosted stock page (it would load
  # scripts from the internet into the page that holds the PIN session).
  js_url: ""
  js_include: device-ui/ui.js
  css_include: device-ui/ui.css

time:
  # Internet time, so clock times work without Home Assistant (the time zone comes from the device page then).
  - platform: sntp
    id: sntp_time
    servers: [pool.ntp.org, time.cloudflare.com, time.google.com]

# Running without Home Assistant (docs/standalone.md): the device page's PIN, write-only keys, notifications
# straight to your phone, and the weather from Open-Meteo for a location stored only on the controller.
standalone:
  id: local
  temperature_unit: ${weather_temperature_unit}
  wind_speed_unit: ${wind_speed_unit}
  outdoor_temperature: outdoor_temp
  outdoor_humidity: outdoor_humidity
  wind_speed: outdoor_wind
  cook_assistant: smoker
  pit_temperature: pit_temp
  pit_target: pit_target_reported

esp32_ble:
  # 1 for the grill's own BLE link + 3 proxy slots (e.g. the Govee H5198) + 1 spare.
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 30ms

# ----------------------------------------------------------------- grill link

gravity980:
  id: grill
  temperature_unit: ${temperature_unit}
  log_raw: false
  bluetooth:
    writes: false   # off at boot; the "Control over Bluetooth" switch turns it on (unverified on the 980)

text:
  - platform: template
    id: grill_host
    name: Grill IP address
    icon: mdi:ip-network
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: id(grill).set_host(x);
  # Grill Wi-Fi setup: the network the grill should join (2.4 GHz) and its password (not saved; cleared once sent).
  - platform: template
    id: grill_wifi_ssid
    name: "Grill Wi-Fi: network name"
    icon: mdi:wifi
    entity_category: config
    mode: text
    max_length: 32
    optimistic: true
    restore_value: true
    initial_value: ""
  - platform: template
    id: grill_wifi_password
    name: "Grill Wi-Fi: password"
    icon: mdi:form-textbox-password
    entity_category: config
    internal: true        # never sent to Home Assistant (it would be recorded): set it on the controller's own page
    mode: password
    max_length: 63
    optimistic: true
    restore_value: false
    initial_value: ""
  # A photo of your grill for the controller's own page (any http(s) URL it can load, e.g. Home Assistant's
  # /local/smoker/grill.png). The Smoker dashboard fills this in when it finds your photo; empty = the drawing.
  - platform: template
    id: grill_photo_url
    name: Grill photo URL
    icon: mdi:image
    entity_category: config
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""
  # Old home of the ntfy topic: moved into the controller's secret store at boot, then emptied (kept for upgrades).
  - platform: template
    id: ntfy_topic
    name: ntfy topic
    internal: true
    icon: mdi:bell-ring
    entity_category: config
    mode: password   # never shown on the device page's event stream
    optimistic: true
    restore_value: true
    initial_value: ""

sensor:
  - platform: template
    id: timer_left
    name: Timer remaining
    icon: mdi:timer-sand
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: never
  - platform: gravity980
    bluetooth_signal:
      name: Grill Bluetooth signal
    grill_wifi_signal:
      name: Grill Wi-Fi signal
    pit_temperature:
      id: pit_temp
      name: Pit temperature
    pit_target:
      id: pit_target_reported
      name: Pit target (reported)
      entity_category: diagnostic
    food1_temperature:
      id: grill_probe1_temp
      name: Grill probe 1 temperature
    food1_target:
      id: grill_probe1_target_reported
      name: Grill probe 1 target (reported)
      entity_category: diagnostic
    food2_temperature:
      id: grill_probe2_temp
      name: Grill probe 2 temperature
    food2_target:
      id: grill_probe2_target_reported
      name: Grill probe 2 target (reported)
      entity_category: diagnostic
  # Outdoor conditions: from Home Assistant's weather, or from Open-Meteo on the controller when a location is set on
  # the device page (then that wins).
  - platform: template
    id: outdoor_temp
    name: Outdoor temperature
    unit_of_measurement: "°${weather_temperature_unit}"
    device_class: temperature
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: outdoor_humidity
    internal: true
    update_interval: never
  - platform: template
    id: outdoor_wind
    internal: true
    update_interval: never
  # Wired probe 1: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe1
    name: Wired probe 1
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 2: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe2
    name: Wired probe 2
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 3: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe3
    name: Wired probe 3
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 4: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe4
    name: Wired probe 4
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  - platform: template
    id: ext_probe1
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe1_target
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe2
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe2_target
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe3
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe3_target
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe4
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe4_target
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe5
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe5_target
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe6
    internal: true
    update_interval: never
  - platform: template
    id: ext_probe6_target
    internal: true
    update_interval: never
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  # Why it last restarted and how much internal memory is free: so a crash or a tight-memory restart shows up in
  # Home Assistant instead of only on a USB cable.
  - platform: debug
    free:
      name: Free memory
      entity_category: diagnostic

binary_sensor:
  # The grill's "on" flag (byte 14 bit 4): clears when it's turned off, sets when it's turned on.
  - platform: template
    name: Grill on
    icon: mdi:power
    lambda: return id(grill).grill_on();
  # The board's BOOT button: hold it 10 s to clear the device page's PIN (someone at the grill, not on the network);
  # hold it 30 s for a factory reset (everything stored on the controller erased: before selling or giving it away);
  # a short press allows Wi-Fi setup over Bluetooth (Improv) for a minute. Both act when the button is let go.
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true   # the BOOT button: read as a button after boot, which is safe
      inverted: true
      mode: {input: true, pullup: true}
    on_click:
      - min_length: 10s
        max_length: 29900ms
        then:
          - lambda: id(local).clear_pin();
      - min_length: 30s
        max_length: 120s
        then:
          - lambda: id(local).factory_reset_now("the BOOT button held 30 s");
  - platform: gravity980
    connected:
      id: grill_connected
      name: Grill connected
    wifi_link:
      name: Grill on Wi-Fi
    bluetooth_link:
      name: Grill on Bluetooth
    door:
      id: lid_open
      name: Lid
    fan:
      id: grill_fan
      name: Fan
    fan_turbo:
      name: Fan turbo
    alarm:
      name: Grill alarm

text_sensor:
  - platform: template
    id: power_prompt
    name: Grill power
    icon: mdi:power
    update_interval: 2s
    lambda: return id(grill).power_prompt();
  # The loaded cook program as the controller parsed it (its own syntax; empty = none), so Home Assistant can check
  # what it actually runs. Home Assistant keeps states to 255 characters: a longer one says so instead.
  - platform: template
    id: program_parsed
    name: Program (as parsed)
    icon: mdi:script-text-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      std::string p = id(smoker).parsed_program();
      if (p.size() > 255) return std::string("too long to show here (") + std::to_string(p.size()) + " characters)";
      return p;
  # Whether the device page has a PIN ("set" / "not set"), and why Home Assistant's last one was refused. Never the PIN.
  - platform: template
    name: Device page PIN
    icon: mdi:lock-outline
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(local).pin_status();
  # The factory reset's prompt: "Press again within 10 s..." after the first press, empty otherwise.
  - platform: template
    id: factory_reset_prompt
    name: Factory reset status
    icon: mdi:delete-alert-outline
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(local).factory_reset_prompt();
  - platform: debug
    reset_reason:
      name: Last restart reason
      entity_category: diagnostic
  - platform: gravity980
    # For support (the "Grill data" issue form): enable it in Home Assistant when asked.
    raw_frame:
      name: Raw status frame
      disabled_by_default: true
    link:
      name: Grill link
    link_status:
      name: Grill link status
    grill_wifi:
      name: Grill Wi-Fi
    wifi_networks:
      name: Grill Wi-Fi networks
  - platform: version
    name: Firmware version
    hide_timestamp: true
  # This project's release (project_version above), for the pages' "Release" row.
  - platform: template
    name: Release
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: return std::string(ESPHOME_PROJECT_VERSION);

globals:
  # A hash of the firmware version that last booted (the "Controller updated" notification).
  - id: booted_version
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: timer_end_ms
    type: uint32_t
    initial_value: "0"

interval:
  # Automatic updates (see the update: section).
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t idle_since = 0, last_try = 0;
          static bool announced = false;
          const uint32_t now = millis();
          // After an update (automatic or not), say so once, when the notifications are up.
          if (!announced && now > 120000UL) {
            announced = true;
            uint32_t h = 2166136261UL;
            for (const char *c = ESPHOME_PROJECT_VERSION; *c; c++) h = (h ^ uint8_t(*c)) * 16777619UL;
            if (id(booted_version) != 0 && id(booted_version) != h)
              id(smoker).notify("Controller updated", std::string("The smoker controller is now running ") +
                                ESPHOME_PROJECT_VERSION + ".", 0, "update");
            id(booted_version) = h;
          }
          const bool idle = !id(grill_connected).state && !id(smoker).cook_active() && !id(smoker).program_in_progress();
          if (!id(auto_update).state || !idle) { idle_since = 0; return; }
          if (idle_since == 0) { idle_since = now ? now : 1; return; }
          if (now - idle_since < 3600000UL) return;
          if (id(firmware_update).state != update::UPDATE_STATE_AVAILABLE) return;
          if (last_try != 0 && now - last_try < 6UL * 3600000UL) return;
          last_try = now ? now : 1;
          ESP_LOGI("auto_update", "Idle for an hour with %s available: installing it",
                   id(firmware_update).update_info.latest_version.c_str());
          id(firmware_update).perform(false);
  # The kitchen timer: counts down, then notifies (like the app's "Timer has finished").
  - interval: 5s
    then:
      - lambda: |-
          if (id(timer_end_ms) == 0) return;
          int32_t left = int32_t(id(timer_end_ms) - millis());
          if (left > 0) {
            id(timer_left).publish_state(float((left + 999) / 1000));
            return;
          }
          id(timer_end_ms) = 0;
          id(timer_left).publish_state(0);
          auto call = id(kitchen_timer).make_call();
          call.set_value(0);
          call.perform();
          id(smoker).notify("Timer finished", "Your smoker timer is done.", 1, "timer");

number:
  # A kitchen timer, like the Char-Griller app's: set minutes to start (0 stops), "Timer remaining" counts down and
  # a notification says when it's done. Kept in the controller, so it works without Home Assistant (not across a
  # restart).
  - platform: template
    id: kitchen_timer
    name: Timer
    icon: mdi:timer-outline
    unit_of_measurement: min
    min_value: 0
    max_value: 1440
    step: 1
    mode: box
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (x <= 0) {
            id(timer_end_ms) = 0;
          } else {
            uint32_t e = millis() + uint32_t(x * 60000.0f);
            id(timer_end_ms) = e ? e : 1;
          }
          id(timer_left).publish_state(x > 0 ? x * 60.0f : 0.0f);
  - platform: gravity980
    pit_target:
      id: pit_setpoint
      name: Pit target
    food1_target:
      id: grill_probe1_target
      name: Grill probe 1 target
      entity_category: config
    food2_target:
      id: grill_probe2_target
      name: Grill probe 2 target
      entity_category: config

  # The highest pit an AI-written program may ask for (Plan with AI, Load as program): hotter steps are brought down
  # to it, with a note. In °F (Home Assistant shows it in your unit).
  - platform: template
    id: ai_max_pit
    name: AI max pit
    icon: mdi:thermometer-alert
    entity_category: config
    device_class: temperature
    unit_of_measurement: "°F"
    min_value: 200
    max_value: 700
    step: 5
    mode: box
    initial_value: 400
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(smoker).set_ai_max_pit_c((x - 32.0f) / 1.8f);

button:
  # Forgotten the device page's PIN? Press this in Home Assistant (or hold the controller's BOOT button for 10 s).
  # Only once Home Assistant has adopted the controller (its API has a key): before that anyone on the Wi-Fi could.
  - platform: template
    name: Clear the device page PIN
    icon: mdi:lock-reset
    entity_category: config
    on_press:
      - lambda: id(local).clear_pin_from_ha();
  # Use a different Govee H5198: the controller remembers the first one it hears, so a neighbour's isn't picked up.
  - platform: template
    name: Forget the thermometer
    icon: mdi:bluetooth-off
    entity_category: config
    on_press:
      - lambda: id(h5198_hub).forget();
  # A different grill (or a new one): forget the remembered one and pick up the next Gravity 980 heard.
  - platform: template
    name: Forget the grill
    icon: mdi:grill-outline
    entity_category: config
    on_press:
      - lambda: id(grill).forget_grill();
  # Turn the grill off (FF 04 0F FF, as the Char-Griller app does) or on (FF 04 1F FF: the grill in standby, its
  # Bluetooth still awake). Safety net: nothing happens on one press; a second press within 10 s does it ("Grill
  # power" says what's armed).
  - platform: template
    name: Turn the grill off
    icon: mdi:power-off
    on_press:
      - lambda: id(grill).power_press(false);
      - component.update: power_prompt
  - platform: template
    name: Turn the grill on
    icon: mdi:power-on
    on_press:
      - lambda: id(grill).power_press(true);
      - component.update: power_prompt
  # Before selling or giving the controller away: erase everything it stores (Wi-Fi, the API key, the device page's
  # PIN and sessions, notification and AI keys, settings, the journal, learned cooks) and restart with its setup
  # hotspot. Nothing happens on one press: a second press within 10 s does it ("Factory reset status" says it's
  # armed). Refused until Home Assistant has adopted the controller (its API has a key); the device page (PIN) and
  # holding the BOOT button for 30 s work too.
  - platform: template
    name: Factory reset
    icon: mdi:delete-forever
    entity_category: config
    on_press:
      - lambda: id(local).factory_reset_from_ha();
      - component.update: factory_reset_prompt
  # Restart the controller (keeps all settings and learned history). Also on its own page and the dashboard.
  - platform: restart
    name: Restart
    icon: mdi:restart
  # Grill Wi-Fi setup over Bluetooth (what the Char-Griller app does): needs the grill connected over Bluetooth.
  - platform: template
    name: "Grill Wi-Fi: join saved network"
    icon: mdi:wifi-refresh
    entity_category: config
    on_press:
      - lambda: id(grill).wifi_rejoin();
  - platform: template
    name: "Grill Wi-Fi: scan"
    icon: mdi:wifi-star
    entity_category: config
    on_press:
      - lambda: id(grill).wifi_scan();
  - platform: template
    name: "Grill Wi-Fi: set up"
    icon: mdi:wifi-plus
    entity_category: config
    on_press:
      - lambda: |-
          id(grill).wifi_join(id(grill_wifi_ssid).state, id(grill_wifi_password).state);
          // the password is not kept: clear it once handed to the grill
          auto call = id(grill_wifi_password).make_call();
          call.set_value("");
          call.perform();

switch:
  - platform: gravity980
    bridge_enabled:
      name: Bridge enabled
  # Target changes over Bluetooth, for grills whose Wi-Fi is unreliable (it is on some mesh/UniFi networks). On by
  # default; confirmed working on a 980. Every write is checked against what the grill reports back (an ignored write
  # changes nothing). Only pit/food targets, Turbo and power on/off (two presses) are ever sent. Wi-Fi is used
  # instead whenever it's connected.
  # Automatic updates: see the update: section. Off unless you turn it on.
  - platform: template
    name: Automatic updates
    id: auto_update
    icon: mdi:update
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: Control over Bluetooth
    id: ble_control
    icon: mdi:bluetooth-settings
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(grill).set_ble_writes(true);
    on_turn_off:
      - lambda: id(grill).set_ble_writes(false);
  # The panel's Turbo, as the Char-Griller app sends it (command 0x04: FF 04 FF 1F on, FF 04 FF 0F off; found in
  # the app's code, docs/protocol.md). The state is the grill's own turbo flag.
  - platform: template
    name: Turbo
    id: turbo_switch
    icon: mdi:fan-chevron-up
    lambda: return id(grill).turbo();
    turn_on_action:
      - lambda: id(grill).set_turbo(true);
    turn_off_action:
      - lambda: id(grill).set_turbo(false);
  # Log every raw TCP/BLE byte from the grill (at INFO level), for support: the "Grill data" issue form asks for it.
  - platform: template
    name: Log raw grill data
    icon: mdi:text-search
    entity_category: config
    disabled_by_default: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(grill).set_log_raw(true);
    on_turn_off:
      - lambda: id(grill).set_log_raw(false);

