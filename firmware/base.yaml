# ----------------------------------------------------------------- cook assistant

cook_assistant:
  id: smoker
  temperature_unit: ${temperature_unit}
  pit_temperature: pit_temp
  pit_setpoint: pit_target_reported
  lid: lid_open
  link: grill_connected
  fan: grill_fan
  hopper_capacity: 7.26   # kg; Gravity 980 hopper = 16 lb
  fuel_level:
    name: Charcoal level
  fuel_left:
    name: Charcoal left
  fuel_hours_left:
    name: Charcoal hours left
  fuel_burn_rate:
    name: Charcoal burn rate
  fuel_empty_at:
    name: Charcoal empty at
  fuel_basis:
    name: Charcoal estimate basis
  fuel_type:
    name: Charcoal type
  slice_at:
    name: Slice at
  ambient_temperature: outdoor_temp
  ambient_humidity: outdoor_humidity
  wind_speed: outdoor_wind
  ambient_temperature_unit: ${weather_temperature_unit}
  wind_speed_unit: ${wind_speed_unit}
  time_id: sntp_time   # Home Assistant's clock instead when it's there (home-assistant.yaml)
  on_set_pit:
    - lambda: id(smoker).pit_write_result(id(grill).request_target(esphome::gravity980::PROBE_PIT, x));
  on_notify:
    # Straight to your phone (ntfy, Pushover, Telegram), as chosen on the device page (Setup > Notifications);
    # home-assistant.yaml adds the copy via Home Assistant. Critical alarms always go direct too.
    - lambda: id(local).notify(title, message, priority, tag);
  on_cook_complete:
    - lambda: id(local).add_cook(json);   # the controller's own journal (device page)
  presets:
    - name: Pork shoulder (Texas crutch)
      program: "name: Pork shoulder; pit 250 until food1 >= 165 for 30m; pit 275 until food1 >= 203; hold 200 notify \"Pork is done - rest it\""
    - name: Brisket
      program: "name: Brisket; pit 250 until food1 >= 165; pit 275 until food1 >= 203; hold 200 notify \"Brisket done - rest 1-2h\""
    - name: Ribs
      program: "name: Ribs; pit 250 until after 3h; pit 250 notify \"Wrap the ribs now\" until after 2h; pit 275 until after 1h; hold 200 notify \"Ribs done\""
    - name: Chicken (hot & fast)
      program: "name: Chicken; pit 325 until food1 >= 160; hold 200 notify \"Chicken is done\""
    - name: Hold warm
      program: "name: Hold warm; hold 200"
  probes:
    - key: food1
      name: Food 1
      sources:
        - name: Grill probe 1
          temperature: grill_probe1_temp
          target: grill_probe1_target_reported
          sync: grill_probe1_target
        - name: Grill probe 2
          temperature: grill_probe2_temp
          target: grill_probe2_target_reported
          sync: grill_probe2_target
        - name: H5198 probe 1
          temperature: h5198_p1
          target: h5198_a1
        - name: H5198 probe 2
          temperature: h5198_p2
          target: h5198_a2
        - name: H5198 probe 3
          temperature: h5198_p3
          target: h5198_a3
        - name: H5198 probe 4
          temperature: h5198_p4
          target: h5198_a4
        - name: Home Assistant
          temperature: ext_probe1
          target: ext_probe1_target
          unit: ${weather_temperature_unit}
        - name: Wired probe 1
          temperature: wired_probe1
          unit: C
        - name: Wired probe 2
          temperature: wired_probe2
          unit: C
        - name: Wired probe 3
          temperature: wired_probe3
          unit: C
        - name: Wired probe 4
          temperature: wired_probe4
          unit: C
      source:
        name: Food 1 probe
      default_source: Grill probe 1
      target_number:
        name: Food 1 target
      reading:
        name: Food 1 temperature
      profile:
        name: Food 1 protein
      weight:
        name: Food 1 weight
      wrapped:
        name: Food 1 wrapped
      time_remaining:
        name: Food 1 time remaining
      time_remaining_low:
        name: Food 1 time remaining (early)
      time_remaining_high:
        name: Food 1 time remaining (late)
      estimated_total:
        name: Food 1 estimated total cook time
      stall_remaining:
        name: Food 1 stall remaining
      rate:
        name: Food 1 rate
      finish_time:
        name: Food 1 finish time
      plan:
        name: Food 1 plan
      phase:
        name: Food 1 phase
      estimate_info:
        name: Food 1 estimate basis
      stall:
        name: Food 1 stall
      probe_warning:
        name: Food 1 probe warning
      pulled:
        name: Food 1 pulled
      pull_at:
        name: Food 1 pull at
      rest_ready:
        name: Food 1 rest ready in
    - key: food2
      name: Food 2
