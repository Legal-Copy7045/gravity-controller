# Gravity 980 smoker bridge: shared device configuration.
#
# Included by gravity980-bridge.yaml (prebuilt firmware) and by your own
# ESPHome dashboard config (see docs/install.md). Override any substitution.

substitutions:
  project_version: "0.2.11"
  name: gravity980
  friendly_name: Smoker
  temperature_unit: "F"            # F or C: the controller's own unit (HA converts for display anyway)
  weather_entity: weather.forecast_home
  weather_temperature_unit: "F"    # the unit your HA weather entity reports (HA unit system)
  wind_speed_unit: "mph"           # mph, km/h or m/s
  ntfy_server: https://ntfy.sh
  update_manifest: https://legal-copy7045.github.io/gravity-controller/firmware/manifest.json
  # Each food slot (Food 1-6) can read a grill probe, an H5198 probe (direct Bluetooth), or a Home Assistant
  # entity: pick it per slot with "Food N probe". The HA package maps entities onto sensor.smoker_external_probe_N
  # (and the thermometer's own alarm, when it has one, onto sensor.smoker_external_probe_N_target).
  # Defaults: Food 1-2 = the grill's probes, Food 3-6 = Home Assistant (helpers 3-6).

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.11.0   # improv_ble, keyless API encryption
  project:
    name: legal-copy7045.gravity980-bridge
    version: ${project_version}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  # Home Assistant sets the encryption key when you add the device.
  encryption: {}
  # Keep running (and cooking) when Home Assistant is away: alarms still go out through ntfy. The default would
  # reboot the controller after 15 minutes without Home Assistant, dropping the grill link and the cook's estimates.
  reboot_timeout: 0s
  actions:
    - action: load_program
      variables:
        program: string
      then:
        - lambda: id(smoker).load_program(program);
    - action: start_program
      then:
        - lambda: id(smoker).start_program();
    - action: pause_program
      then:
        - lambda: id(smoker).pause_program();
    - action: resume_program
      then:
        - lambda: id(smoker).resume_program();
    - action: skip_step
      then:
        - lambda: id(smoker).skip_step();
    - action: stop_program
      then:
        - lambda: id(smoker).stop_program();
    - action: set_pit_target
      variables:
        value: float
      then:
        - lambda: id(grill).request_target(esphome::gravity980::PROBE_PIT, value);
    # Fuel gauge: levels in % of a full hopper.
    - action: fuel_level          # "I looked: it's at N %" (no fuel added since the last entry)
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_level(percent);
    - action: fuel_refilled       # "topped up, now at N %"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_refilled(percent);
    - action: fuel_added          # "added N % of a hopper"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_added(percent);
    - action: fuel_end            # "cook over, N % left"
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_end(percent);
    # Hourly outdoor forecast from Home Assistant (minutes from now, temperature in the weather unit).
    - action: set_forecast
      variables:
        minutes: float[]
        temps: float[]
      then:
        - lambda: id(smoker).set_forecast(minutes, temps);
    # Context for the HA AI advisor: fires esphome.smoker_context with live state + cook history.
    - action: request_context
      then:
        - homeassistant.event:
            event: esphome.smoker_context
            data:
              state: !lambda return id(smoker).state_json();
              history: !lambda return id(smoker).history_json();

ota:
  - platform: esphome
  - platform: http_request

http_request:
  timeout: 15s

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${update_manifest}
    update_interval: 6h

wifi:
  # A grill at the edge of Wi-Fi: keep trying rather than rebooting (the BLE link to the grill can carry on).
  reboot_timeout: 0s
  ap:
    # Open setup hotspot (after 90 s without Wi-Fi). It only offers Wi-Fi setup; the device web page's own
    # firmware upload is off, but the setup portal is unauthenticated while it's up: keep that in mind.
    ssid: "${friendly_name} setup"
  on_connect:
    - logger.log: Wi-Fi connected

captive_portal:
improv_serial:
improv_ble:
  authorizer: none

web_server:
  port: 80
  version: 3
  ota: false   # no firmware upload from the device web page on the LAN
  include_internal: true   # the Wi-Fi password field is internal (kept out of Home Assistant) but set from this page
  # The smoker's own page (firmware/device-ui), stored gzipped in flash and served as /0.js and /0.css, so
  # http://gravity980.local works with no internet. An empty js_url drops ESPHome's hosted stock page;
  # http://gravity980.local/?classic still loads it (from oi.esphome.io, so that view needs internet).
  js_url: ""
  js_include: device-ui/ui.js
  css_include: device-ui/ui.css

time:
  - platform: homeassistant
    id: ha_time

esp32_ble:
  # 1 for the grill's own BLE link + 3 proxy slots (e.g. the Govee H5198) + 1 spare.
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 30ms

# Home Assistant Bluetooth proxy: the smoker controller is the closest radio to
# Bluetooth thermometers at the grill (Govee H5198, etc.).
bluetooth_proxy:
  active: true
  connection_slots: 3

# ----------------------------------------------------------------- grill link

gravity980:
  id: grill
  temperature_unit: ${temperature_unit}
  log_raw: false
  bluetooth:
    writes: false   # off at boot; the "Control over Bluetooth" switch turns it on (unverified on the 980)

text:
  - platform: template
    id: grill_host
    name: Grill IP address
    icon: mdi:ip-network
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: id(grill).set_host(x);
  # Grill Wi-Fi setup: the network the grill should join (2.4 GHz) and its password (not saved; cleared once sent).
  - platform: template
    id: grill_wifi_ssid
    name: "Grill Wi-Fi: network name"
    icon: mdi:wifi
    entity_category: config
    mode: text
    max_length: 32
    optimistic: true
    restore_value: true
    initial_value: ""
  - platform: template
    id: grill_wifi_password
    name: "Grill Wi-Fi: password"
    icon: mdi:form-textbox-password
    entity_category: config
    internal: true        # never sent to Home Assistant (it would be recorded): set it on the controller's own page
    mode: password
    max_length: 63
    optimistic: true
    restore_value: false
    initial_value: ""
  # A photo of your grill for the controller's own page (any http(s) URL it can load, e.g. Home Assistant's
  # /local/smoker/grill.png). The Smoker dashboard fills this in when it finds your photo; empty = the drawing.
  - platform: template
    id: grill_photo_url
    name: Grill photo URL
    icon: mdi:image
    entity_category: config
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: ""
  - platform: template
    id: ntfy_topic
    name: ntfy topic
    icon: mdi:bell-ring
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""

sensor:
  - platform: gravity980
    pit_temperature:
      id: pit_temp
      name: Pit temperature
    pit_target:
      id: pit_target_reported
      name: Pit target (reported)
      entity_category: diagnostic
    food1_temperature:
      id: grill_probe1_temp
      name: Grill probe 1 temperature
    food1_target:
      id: grill_probe1_target_reported
      name: Grill probe 1 target (reported)
      entity_category: diagnostic
    food2_temperature:
      id: grill_probe2_temp
      name: Grill probe 2 temperature
    food2_target:
      id: grill_probe2_target_reported
      name: Grill probe 2 target (reported)
      entity_category: diagnostic
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true
  - platform: homeassistant
    id: outdoor_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    internal: true
  - platform: homeassistant
    id: outdoor_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    internal: true
  # Wired probe 1: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe1
    name: Wired probe 1
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 2: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe2
    name: Wired probe 2
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 3: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe3
    name: Wired probe 3
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  # Wired probe 4: no reading unless firmware/wired-probes.yaml (ADS1115 + NTC probes) is included.
  - platform: template
    id: wired_probe4
    name: Wired probe 4
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
    lambda: return NAN;
    internal: true
  - platform: homeassistant
    id: ext_probe1
    entity_id: sensor.smoker_external_probe_1
    internal: true
  - platform: homeassistant
    id: ext_probe1_target
    entity_id: sensor.smoker_external_probe_1_target
    internal: true
  - platform: homeassistant
    id: ext_probe2
    entity_id: sensor.smoker_external_probe_2
    internal: true
  - platform: homeassistant
    id: ext_probe2_target
    entity_id: sensor.smoker_external_probe_2_target
    internal: true
  - platform: homeassistant
    id: ext_probe3
    entity_id: sensor.smoker_external_probe_3
    internal: true
  - platform: homeassistant
    id: ext_probe3_target
    entity_id: sensor.smoker_external_probe_3_target
    internal: true
  - platform: homeassistant
    id: ext_probe4
    entity_id: sensor.smoker_external_probe_4
    internal: true
  - platform: homeassistant
    id: ext_probe4_target
    entity_id: sensor.smoker_external_probe_4_target
    internal: true
  - platform: homeassistant
    id: ext_probe5
    entity_id: sensor.smoker_external_probe_5
    internal: true
  - platform: homeassistant
    id: ext_probe5_target
    entity_id: sensor.smoker_external_probe_5_target
    internal: true
  - platform: homeassistant
    id: ext_probe6
    entity_id: sensor.smoker_external_probe_6
    internal: true
  - platform: homeassistant
    id: ext_probe6_target
    entity_id: sensor.smoker_external_probe_6_target
    internal: true
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

binary_sensor:
  - platform: gravity980
    connected:
      id: grill_connected
      name: Grill connected
    door:
      id: lid_open
      name: Lid
    fan:
      id: grill_fan
      name: Fan
    fan_turbo:
      name: Fan turbo
    alarm:
      name: Grill alarm

text_sensor:
  - platform: gravity980
    raw_frame:
      name: Raw status frame
    link:
      name: Grill link
    grill_wifi:
      name: Grill Wi-Fi
    wifi_networks:
      name: Grill Wi-Fi networks
  - platform: version
    name: Firmware version
    hide_timestamp: true

number:
  - platform: gravity980
    pit_target:
      id: pit_setpoint
      name: Pit target
    food1_target:
      id: grill_probe1_target
      name: Grill probe 1 target
      entity_category: config
    food2_target:
      id: grill_probe2_target
      name: Grill probe 2 target
      entity_category: config

button:
  # Restart the controller (keeps all settings and learned history). Also on its own page and the dashboard.
  - platform: restart
    name: Restart
    icon: mdi:restart
  # Grill Wi-Fi setup over Bluetooth (what the Char-Griller app does): needs the grill connected over Bluetooth.
  - platform: template
    name: "Grill Wi-Fi: join saved network"
    icon: mdi:wifi-refresh
    entity_category: config
    on_press:
      - lambda: id(grill).wifi_rejoin();
  - platform: template
    name: "Grill Wi-Fi: scan"
    icon: mdi:wifi-star
    entity_category: config
    on_press:
      - lambda: id(grill).wifi_scan();
  - platform: template
    name: "Grill Wi-Fi: set up"
    icon: mdi:wifi-plus
    entity_category: config
    on_press:
      - lambda: |-
          id(grill).wifi_join(id(grill_wifi_ssid).state, id(grill_wifi_password).state);
          // the password is not kept: clear it once handed to the grill
          auto call = id(grill_wifi_password).make_call();
          call.set_value("");
          call.perform();

switch:
  - platform: gravity980
    bridge_enabled:
      name: Bridge enabled
  # Log every raw TCP/BLE byte from the grill (for protocol investigation; logs at DEBUG level).
  # Target changes over Bluetooth, for grills whose Wi-Fi is unreliable (it is on some mesh/UniFi networks). On by
  # default; confirmed working on a 980. Every write is checked against what the grill reports back (an ignored write
  # changes nothing), and only pit/food targets are ever sent. Wi-Fi is used instead whenever it's connected.
  - platform: template
    name: Control over Bluetooth
    id: ble_control
    icon: mdi:bluetooth-settings
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(grill).set_ble_writes(true);
    on_turn_off:
      - lambda: id(grill).set_ble_writes(false);
  - platform: template
    name: Log raw grill data
    icon: mdi:text-search
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(grill).set_log_raw(true);
    on_turn_off:
      - lambda: id(grill).set_log_raw(false);

# ----------------------------------------------------------------- Govee H5198 (direct Bluetooth)

govee_h5198:
  id: h5198_hub
  temperature_unit: ${temperature_unit}
  probe_1:
    id: h5198_p1
    name: H5198 probe 1
  probe_1_alarm:
    id: h5198_a1
    name: H5198 probe 1 alarm
  probe_2:
    id: h5198_p2
    name: H5198 probe 2
  probe_2_alarm:
    id: h5198_a2
    name: H5198 probe 2 alarm
  probe_3:
    id: h5198_p3
    name: H5198 probe 3
  probe_3_alarm:
    id: h5198_a3
    name: H5198 probe 3 alarm
  probe_4:
    id: h5198_p4
    name: H5198 probe 4
  probe_4_alarm:
    id: h5198_a4
    name: H5198 probe 4 alarm
  rssi:
    name: H5198 signal
  connected:
    name: H5198 connected

# ----------------------------------------------------------------- cook assistant

cook_assistant:
  id: smoker
  temperature_unit: ${temperature_unit}
  pit_temperature: pit_temp
  pit_setpoint: pit_target_reported
  lid: lid_open
  link: grill_connected
  fan: grill_fan
  hopper_capacity: 7.26   # kg; Gravity 980 hopper = 16 lb
  fuel_level:
    name: Charcoal level
  fuel_left:
    name: Charcoal left
  fuel_hours_left:
    name: Charcoal hours left
  fuel_burn_rate:
    name: Charcoal burn rate
  fuel_empty_at:
    name: Charcoal empty at
  fuel_basis:
    name: Charcoal estimate basis
  fuel_type:
    name: Charcoal type
  slice_at:
    name: Slice at
  ambient_temperature: outdoor_temp
  ambient_humidity: outdoor_humidity
  wind_speed: outdoor_wind
  ambient_temperature_unit: ${weather_temperature_unit}
  wind_speed_unit: ${wind_speed_unit}
  time_id: ha_time
  on_set_pit:
    - lambda: id(smoker).pit_write_result(id(grill).request_target(esphome::gravity980::PROBE_PIT, x));
  on_notify:
    - homeassistant.event:
        event: esphome.smoker_notify
        data:
          title: !lambda return title;
          message: !lambda return message;
          priority: !lambda return priority;
          tag: !lambda return tag;
    # Critical alarms also go straight to ntfy, so they arrive even if HA is down.
    - if:
        condition:
          lambda: return priority >= 2 && !id(ntfy_topic).state.empty();
        then:
          - http_request.post:
              url: !lambda return std::string("${ntfy_server}/") + id(ntfy_topic).state;
              request_headers:
                Title: !lambda return title.c_str();
                Priority: "urgent"
                Tags: "fire,warning"
              body: !lambda return message;
  on_cook_complete:
    - homeassistant.event:
        event: esphome.smoker_cook_complete
        data:
          summary: !lambda return json;
  presets:
    - name: Pork shoulder (Texas crutch)
      program: "name: Pork shoulder; pit 250 until food1 >= 165 for 30m; pit 275 until food1 >= 203; hold 200 notify \"Pork is done - rest it\""
    - name: Brisket
      program: "name: Brisket; pit 250 until food1 >= 165; pit 275 until food1 >= 203; hold 200 notify \"Brisket done - rest 1-2h\""
    - name: Ribs
      program: "name: Ribs; pit 250 until after 3h; pit 250 notify \"Wrap the ribs now\" until after 2h; pit 275 until after 1h; hold 200 notify \"Ribs done\""
    - name: Chicken (hot & fast)
      program: "name: Chicken; pit 325 until food1 >= 160; hold 200 notify \"Chicken is done\""
    - name: Hold warm
      program: "name: Hold warm; hold 200"
  probes:
    - key: food1
      name: Food 1
      sources:
        - name: Grill probe 1
          temperature: grill_probe1_temp
          target: grill_probe1_target_reported
          sync: grill_probe1_target
        - name: Grill probe 2
          temperature: grill_probe2_temp
          target: grill_probe2_target_reported
          sync: grill_probe2_target
        - name: H5198 probe 1
          temperature: h5198_p1
          target: h5198_a1
        - name: H5198 probe 2
          temperature: h5198_p2
          target: h5198_a2
        - name: H5198 probe 3
          temperature: h5198_p3
          target: h5198_a3
        - name: H5198 probe 4
          temperature: h5198_p4
          target: h5198_a4
        - name: Home Assistant
          temperature: ext_probe1
          target: ext_probe1_target
          unit: ${weather_temperature_unit}
        - name: Wired probe 1
          temperature: wired_probe1
          unit: C
        - name: Wired probe 2
          temperature: wired_probe2
          unit: C
        - name: Wired probe 3
          temperature: wired_probe3
          unit: C
        - name: Wired probe 4
          temperature: wired_probe4
          unit: C
      source:
        name: Food 1 probe
      default_source: Grill probe 1
      target_number:
        name: Food 1 target
      reading:
        name: Food 1 temperature
      profile:
        name: Food 1 protein
      weight:
        name: Food 1 weight
      wrapped:
        name: Food 1 wrapped
      time_remaining:
        name: Food 1 time remaining
      time_remaining_low:
        name: Food 1 time remaining (early)
      time_remaining_high:
        name: Food 1 time remaining (late)
      estimated_total:
        name: Food 1 estimated total cook time
      stall_remaining:
        name: Food 1 stall remaining
      rate:
        name: Food 1 rate
      finish_time:
        name: Food 1 finish time
      phase:
        name: Food 1 phase
      estimate_info:
        name: Food 1 estimate basis
      stall:
        name: Food 1 stall
      probe_warning:
        name: Food 1 probe warning
      pulled:
        name: Food 1 pulled
      pull_at:
        name: Food 1 pull at
      rest_ready:
        name: Food 1 rest ready in
    - key: food2
      name: Food 2
      sources:
        - name: Grill probe 1
          temperature: grill_probe1_temp
          target: grill_probe1_target_reported
          sync: grill_probe1_target
        - name: Grill probe 2
          temperature: grill_probe2_temp
          target: grill_probe2_target_reported
          sync: grill_probe2_target
        - name: H5198 probe 1
          temperature: h5198_p1
          target: h5198_a1
        - name: H5198 probe 2
          temperature: h5198_p2
          target: h5198_a2
        - name: H5198 probe 3
          temperature: h5198_p3
          target: h5198_a3
        - name: H5198 probe 4
          temperature: h5198_p4
          target: h5198_a4
        - name: Home Assistant
          temperature: ext_probe2
          target: ext_probe2_target
          unit: ${weather_temperature_unit}
        - name: Wired probe 1
          temperature: wired_probe1
          unit: C
        - name: Wired probe 2
          temperature: wired_probe2
          unit: C
        - name: Wired probe 3
          temperature: wired_probe3
          unit: C
        - name: Wired probe 4
          temperature: wired_probe4
          unit: C
      source:
        name: Food 2 probe
      default_source: Grill probe 2
      target_number:
        name: Food 2 target
      reading:
        name: Food 2 temperature
      profile:
        name: Food 2 protein
      weight:
        name: Food 2 weight
      wrapped:
        name: Food 2 wrapped
      time_remaining:
        name: Food 2 time remaining
      time_remaining_low:
        name: Food 2 time remaining (early)
      time_remaining_high:
        name: Food 2 time remaining (late)
      estimated_total:
        name: Food 2 estimated total cook time
      stall_remaining:
        name: Food 2 stall remaining
      rate:
        name: Food 2 rate
      finish_time:
        name: Food 2 finish time
      phase:
        name: Food 2 phase
      estimate_info:
        name: Food 2 estimate basis
      stall:
        name: Food 2 stall
      probe_warning:
        name: Food 2 probe warning
      pulled:
        name: Food 2 pulled
      pull_at:
        name: Food 2 pull at
      rest_ready:
        name: Food 2 rest ready in
    - key: food3
      name: Food 3
      sources:
        - name: Grill probe 1
          temperature: grill_probe1_temp
          target: grill_probe1_target_reported
          sync: grill_probe1_target
        - name: Grill probe 2
          temperature: grill_probe2_temp
          target: grill_probe2_target_reported
          sync: grill_probe2_target
        - name: H5198 probe 1
          temperature: h5198_p1
          target: h5198_a1
        - name: H5198 probe 2
          temperature: h5198_p2
          target: h5198_a2
        - name: H5198 probe 3
          temperature: h5198_p3
          target: h5198_a3
        - name: H5198 probe 4
          temperature: h5198_p4
          target: h5198_a4
        - name: Home Assistant
          temperature: ext_probe3
          target: ext_probe3_target
          unit: ${weather_temperature_unit}
        - name: Wired probe 1
          temperature: wired_probe1
          unit: C
        - name: Wired probe 2
          temperature: wired_probe2
          unit: C
        - name: Wired probe 3
          temperature: wired_probe3
          unit: C
        - name: Wired probe 4
          temperature: wired_probe4
          unit: C
      source:
        name: Food 3 probe
      default_source: Home Assistant
      target_number:
        name: Food 3 target
      reading:
        name: Food 3 temperature
      profile:
        name: Food 3 protein
      weight:
        name: Food 3 weight
      wrapped:
        name: Food 3 wrapped
      time_remaining:
        name: Food 3 time remaining
      time_remaining_low:
        name: Food 3 time remaining (early)
      time_remaining_high:
        name: Food 3 time remaining (late)
      estimated_total:
