# Gravity 980 smoker controller: shared device configuration.
#
# Included by gravity980-bridge.yaml (prebuilt firmware) and by your own ESPHome dashboard config
# (see docs/install.md). Override any substitution (they're in base.yaml).
#   base.yaml            everything that works without Home Assistant (docs/standalone.md)
#   home-assistant.yaml  the Home Assistant side: API, clock, weather and thermometers, Bluetooth proxy, events
packages:
  base: !include base.yaml
  home_assistant: !include home-assistant.yaml
