      wrapped:
        name: Govee 3 wrapped
      time_remaining:
        name: Govee 3 time remaining
      time_remaining_low:
        name: Govee 3 time remaining (early)
      time_remaining_high:
        name: Govee 3 time remaining (late)
      estimated_total:
        name: Govee 3 estimated total cook time
      rate:
        name: Govee 3 rate
      finish_time:
        name: Govee 3 finish time
      phase:
        name: Govee 3 phase
      stall:
        name: Govee 3 stall
      probe_warning:
        name: Govee 3 probe warning
    - key: govee4
      name: Govee 4
      temperature: govee4_temp
      target_number:
        name: Govee 4 target
      profile:
        name: Govee 4 protein
      weight:
        name: Govee 4 weight
      wrapped:
        name: Govee 4 wrapped
      time_remaining:
        name: Govee 4 time remaining
      time_remaining_low:
        name: Govee 4 time remaining (early)
      time_remaining_high:
        name: Govee 4 time remaining (late)
      estimated_total:
        name: Govee 4 estimated total cook time
      rate:
        name: Govee 4 rate
      finish_time:
        name: Govee 4 finish time
