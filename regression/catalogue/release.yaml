# Release tooling and the live system: ci stage (repo rules, workflow hygiene) and live stage (read-only checks
# against the owner's Home Assistant and the public GitHub release).
- feature: "Release: versions agree, CHANGELOG notes, brand files, privacy guard"
  since: 0.2.0
  docs: CLAUDE.md
  match: ["^ci:(versions agree|release notes|brand files|privacy guard)"]
- feature: "Workflow security: pinned actions, permissions, signing key only in the release-signing environment"
  since: 1.3.0
  docs: docs/install.md
  match: ["^ci:(every GitHub Action|workflow sets|the OTA signing key|no pull_request_target|no key or secrets)"]
- feature: "Regression suite hygiene"
  since: 1.4.0
  docs: regression/README.md
  match: ["^ci:regression/out"]
- feature: "Live system on this release (read-only)"
  since: 1.4.0
  docs: CLAUDE.md
  match: ["^live:"]
