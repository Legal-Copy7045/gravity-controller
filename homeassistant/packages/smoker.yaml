# Gravity 980 smoker: Home Assistant package
#
# Install: copy to /config/packages/smoker.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. See docs/install.md.
#
# Assumes the ESPHome device is named "gravity980" with friendly name "Smoker"
# (entity ids sensor.smoker_*, actions esphome.gravity980_*).
#
# Edit the two lines marked EDIT below (your phone and AI task entity).

# ------------------------------------------------------------------- helpers

input_boolean:
  smoker_ai_advisor:
    name: Smoker AI advisor
    icon: mdi:robot-outline
    initial: true

input_number:
  smoker_ai_eta_minutes:
    name: Smoker AI ETA (minutes)
    min: 0
    max: 3000
    step: 1
    mode: box
    icon: mdi:robot
  smoker_rest_minutes:
    name: Smoker rest time
    min: 0
    max: 240
    step: 5
    initial: 60
    unit_of_measurement: min
    icon: mdi:timer-sand

input_text:
  smoker_ai_summary:
    name: Smoker AI summary
    max: 255
  smoker_ai_suggestion:
    name: Smoker AI suggestion
    max: 255
  smoker_ai_last_cook:
    name: Smoker last cook summary
    max: 255
  smoker_plan_request:
    name: Smoker plan request
    max: 255
    icon: mdi:chat-processing

input_datetime:
  smoker_ai_finish:
    name: Smoker AI finish time
    has_date: true
    has_time: true
    icon: mdi:robot
  smoker_serve_time:
    name: Smoker serve by
    has_date: true
    has_time: true
    icon: mdi:silverware-fork-knife

timer:
  smoker_rest:
    name: Smoker rest timer
    icon: mdi:timer-sand-complete

# ------------------------------------------------------------------- derived sensors

template:
  # Latest context the controller sent (esphome.smoker_context): live state and cook history as JSON, for the AI.
  - triggers:
      - trigger: event
        event_type: esphome.smoker_context
    sensor:
      - name: Smoker AI context
        unique_id: smoker_ai_context
        icon: mdi:code-json
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        attributes:
          state_json: "{{ trigger.event.data.state }}"
          history_json: "{{ trigger.event.data.history }}"
  # The AI's recommendations for the dashboard (kept across restarts).
  - triggers:
      - trigger: event
        event_type: smoker_ai_recommendations
    sensor:
      - name: Smoker recommendations
        unique_id: smoker_ai_recommendations
        icon: mdi:chef-hat
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          mode: "{{ trigger.event.data.mode }}"
          summary: "{{ trigger.event.data.summary }}"
          items: "{{ trigger.event.data['items'] }}"
  - sensor:
      - name: Smoker food 1 finish
        unique_id: smoker_food1_finish
        device_class: timestamp
        state: >
          {% set m = states('sensor.smoker_food_1_time_remaining') %}
          {{ (now() + timedelta(minutes=m|float)).isoformat() if is_number(m) else none }}
      - name: Smoker food 2 finish
        unique_id: smoker_food2_finish
        device_class: timestamp
        state: >
          {% set m = states('sensor.smoker_food_2_time_remaining') %}
          {{ (now() + timedelta(minutes=m|float)).isoformat() if is_number(m) else none }}
      - name: Smoker AI finish
        unique_id: smoker_ai_finish
        device_class: timestamp
        state: >
          {% set ts = state_attr('input_datetime.smoker_ai_finish', 'timestamp') %}
          {{ (ts | as_datetime | as_local).isoformat() if ts and ts > as_timestamp(now()) - 3600
             and is_state('binary_sensor.smoker_cook_active', 'on') else none }}
      # "Ready by" planner: when to light the grill to serve at input_datetime.smoker_serve_time.
      - name: Smoker start cooking by
        unique_id: smoker_start_by
        device_class: timestamp
        icon: mdi:fire-alert
        state: >
          {% set serve = states('input_datetime.smoker_serve_time') %}
          {% set total = states('sensor.smoker_food_1_estimated_total_cook_time') %}
          {% set rest = states('input_number.smoker_rest_minutes') | float(60) %}
          {% set ts = as_datetime(serve) | as_local if serve not in ['unknown', 'unavailable', ''] else none %}
          {% if ts and ts > now() and is_number(total) %}
            {# + 45 min to light the grill and come up to temperature #}
            {{ (ts - timedelta(minutes=total|float + rest + 45)).isoformat() }}
          {% else %}{{ none }}{% endif %}

# ------------------------------------------------------------------- scripts

script:
  # Single place that decides how smoker notifications reach your phone.
  smoker_notify:
    alias: Smoker notify
    mode: queued
    fields:
      title: {description: Title}
      message: {description: Message}
      priority: {description: "0 info, 1 high, 2 critical"}
      tag: {description: Notification tag (replaces older ones with the same tag)}
      actions: {description: Optional actionable buttons}
    sequence:
      - variables:
          prio: "{{ priority | int(0) }}"
          push:
            interruption-level: "{{ 'critical' if prio >= 2 else ('time-sensitive' if prio == 1 else 'active') }}"
            sound: >
              {{ {'name': 'default', 'critical': 1, 'volume': 1.0} if prio >= 2 else 'default' }}
      # EDIT: your phone's notify action (Settings > Companion app shows the device name).
      - action: notify.mobile_app_your_phone
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: "smoker_{{ tag | default('general') }}"
            group: smoker
            url: /smoker-dashboard
            push: "{{ push }}"
            actions: "{{ actions | default([]) }}"

  smoker_plan_cook:
    alias: Smoker plan cook with AI
    description: Describe the cook in plain words; the AI writes a cook program and loads it (not started).
    icon: mdi:robot-happy
    mode: single
    fields:
      request:
        description: e.g. "8 lb pork butt, done by 6pm, I'll wrap at the stall"
        selector: {text: {multiline: true}}
    sequence:
      - if:
          - condition: template
            value_template: "{{ states('sensor.smoker_program_state') in ['Running', 'Paused'] }}"
        then:
          - action: script.smoker_notify
            data:
              title: Program already running
              message: Stop the running cook program before planning a new one.
              priority: 0
              tag: plan
          - stop: A program is running
      - variables:
          req: "{{ request if request is defined and request else states('input_text.smoker_plan_request') }}"
      - action: ai_task.generate_data
        response_variable: plan
        data:
          task_name: Smoker cook plan
          # EDIT: your AI task entity.
          entity_id: ai_task.google_ai_task
          instructions: |
            You plan cooks for a Char-Griller Gravity 980 charcoal smoker. Write a cook program in this exact language.
            The pit can be set from 200°F to 700°F only (so hold the meat warm at 200°F, never lower).
            Steps separated by ';'. Each step: actions then optional 'until' conditions joined by 'or'.
            Actions: 'pit N' (set pit °F), 'hold N' (set and stay), 'notify "text"', 'shutdown'.
            Conditions: 'food1 >= N [for Nm]', 'food1 <= N', 'food1 done', 'after Nh|Nm', 'at HH:MM',
            'stall_start food1', 'stall_end food1'. Probes: pit, food1, food2. Temperatures in °F.
            Start with 'name: <short name>;'. Keep it under 240 characters. Example:
            name: Pork butt; pit 250 until food1 >= 165 for 30m; pit 275 until food1 >= 203; hold 200 notify "Rest it"
            Current time: {{ now().strftime('%a %H:%M') }}. Outdoor: {{ state_attr('weather.forecast_home', 'temperature') }}°F,
            wind {{ state_attr('weather.forecast_home', 'wind_speed') }} mph.
            The cook: {{ req }}
          structure:
            program:
              description: The cook program text
              required: true
              selector: {text: {}}
            explanation:
              description: One or two sentences explaining the plan and the expected timing
              required: true
              selector: {text: {}}
      - action: esphome.gravity980_load_program
        data:
          program: "{{ plan.data.program }}"
      - delay: 2
      - if:
          - condition: template
            value_template: "{{ states('sensor.smoker_program_error') not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: script.smoker_notify
            data:
              title: AI plan rejected
              message: "The controller rejected the program: {{ states('sensor.smoker_program_error') }}"
              priority: 0
              tag: plan
        else:
          - action: script.smoker_notify
            data:
              title: Cook plan ready
              message: "{{ plan.data.explanation }} Program: {{ plan.data.program }}"
              priority: 0
              tag: plan
              actions:
                - action: SMOKER_START_PROGRAM
                  title: Start program

  # AI advisor: a second-opinion ETA, a one-line summary, a tip, and the Recommendations list on the dashboard.
  # Before a cook it writes a prep + lighting plan; during a cook, what to do next.
  smoker_ai_advise:
    alias: Smoker AI advisor run
    mode: single
    max_exceeded: silent
    sequence:
      # The controller answers with an esphome.smoker_context event, captured by sensor.smoker_ai_context below.
      - action: esphome.gravity980_request_context
        continue_on_error: true
      - delay: 3
      - action: weather.get_forecasts
        continue_on_error: true
        target: {entity_id: weather.forecast_home}
        data: {type: hourly}
        response_variable: fc
      - variables:
          cooking: "{{ is_state('binary_sensor.smoker_cook_active', 'on') }}"
          ctx_state: "{{ state_attr('sensor.smoker_ai_context', 'state_json') or '{}' }}"
          ctx_history: "{{ state_attr('sensor.smoker_ai_context', 'history_json') or '[]' }}"
          forecast: >
            {% set f = (fc or {}).get('weather.forecast_home', {}).get('forecast', []) %}
            {% for h in f[:16] %}{{ as_timestamp(h.datetime) | timestamp_custom('%H:%M') }} {{ h.temperature }}°F
            {{ h.condition }} wind {{ h.wind_speed }} rain {{ h.precipitation_probability | default(0) }}%; {% endfor %}
      - action: ai_task.generate_data
        response_variable: advice
        data:
          task_name: Smoker advisor
          entity_id: ai_task.google_ai_task
          instructions: |
            You are an experienced pitmaster coaching someone cooking on a Char-Griller Gravity 980 gravity-fed charcoal
            smoker (16 lb hopper, fan-controlled, holds 200-700°F). {{ 'A cook is in progress.' if cooking else 'No cook is running yet: plan the next one.' }}
            The smoker controller's own physics model (fitted to this cook and to similar past cooks) gives
            minutes_remaining with an early/late range for each probe; give an independent second opinion.
            Live state (JSON): {{ ctx_state }}
            Past cooks on this grill (JSON): {{ ctx_history }}
            Weather now: {{ state_attr('weather.forecast_home', 'temperature') }}°F, humidity {{ state_attr('weather.forecast_home', 'humidity') }}%,
            wind {{ state_attr('weather.forecast_home', 'wind_speed') }} mph, {{ states('weather.forecast_home') }}.
            Hourly forecast: {{ forecast }}
            Serve-by time: {{ states('input_datetime.smoker_serve_time') }}. Now: {{ now().strftime('%a %H:%M') }}.
            Planned rest: {{ states('input_number.smoker_rest_minutes') }} min.
            Recommendations: 3 to 6 concrete, ordered instructions for what to do next, each on its own line as
            "WHEN | TITLE | DETAIL" (WHEN like "now", "18:30", "at 165°F", "when it stalls"). Before a cook: prep
            (trim, rub, bring-to-temperature), when to light the grill to make the serve time, fuel (fill the hopper; how
            much charcoal for the expected time and weather), water pan, probe placement, the cook plan and what to
            expect (stall, wrap point). During a cook: what to do next and when. Mention weather effects (cold, wind,
            rain) when they matter. No generic food-safety boilerplate.
          structure:
            eta_minutes:
              description: Minutes until the main food probe reaches its target (0 if no cook or unknown)
              required: true
              selector: {number: {min: 0, max: 3000}}
            summary:
              description: One sentence on how the cook is going, or the plan if none is running (max 200 characters)
              required: true
              selector: {text: {}}
            suggestion:
              description: The single most important action right now, or empty if none is needed (max 200 characters)
              required: false
              selector: {text: {}}
            recommendations:
              description: 3-6 lines, each "WHEN | TITLE | DETAIL"
              required: true
              selector: {text: {multiline: true}}
      - variables:
          items: >
            {% set out = namespace(l=[]) %}
            {% for line in (advice.data.recommendations | default('')).split('\n') if '|' in line %}
              {% set p = line.split('|') %}
              {% set out.l = out.l + [{'when': p[0] | trim, 'title': (p[1] | default('')) | trim,
                                       'detail': (p[2:] | join('|')) | trim}] %}
            {% endfor %}
            {{ out.l[:8] }}
      - event: smoker_ai_recommendations
        event_data:
          mode: "{{ 'live' if cooking else 'plan' }}"
          summary: "{{ advice.data.summary }}"
          items: "{{ items }}"
      - if: "{{ cooking and (advice.data.eta_minutes | int(0)) > 0 }}"
        then:
          - variables:
              eta: "{{ [advice.data.eta_minutes | int(0), 3000] | min }}"
          - action: input_number.set_value
            target: {entity_id: input_number.smoker_ai_eta_minutes}
            data: {value: "{{ eta }}"}
          - action: input_datetime.set_datetime
            target: {entity_id: input_datetime.smoker_ai_finish}
            data: {timestamp: "{{ as_timestamp(now()) + eta * 60 }}"}
      - action: input_text.set_value
        target: {entity_id: input_text.smoker_ai_summary}
        data: {value: "{{ (advice.data.summary or '')[:250] }}"}
      - if:
          - condition: template
            value_template: >
              {{ cooking and (advice.data.suggestion or '') | length > 0 and
                 advice.data.suggestion[:250] != states('input_text.smoker_ai_suggestion') }}
        then:
          - action: input_text.set_value
            target: {entity_id: input_text.smoker_ai_suggestion}
            data: {value: "{{ advice.data.suggestion[:250] }}"}
          - action: script.smoker_notify
            data:
              title: Pitmaster tip
              message: "{{ advice.data.suggestion }}"
              priority: 0
              tag: ai

# ------------------------------------------------------------------- automations

automation:
  - id: smoker_forward_notifications
    alias: Smoker - forward controller notifications
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: esphome.smoker_notify
    actions:
      - variables:
          tag: "{{ trigger.event.data.tag }}"
          buttons: >
            {% if tag.startswith('done_') %}
              [{"action": "SMOKER_FOOD_PLUS_5_{{ tag[5:] | upper }}", "title": "+5°F target"},
               {"action": "SMOKER_PIT_HOLD", "title": "Stop program, hold pit at 200°F"}]
            {% elif tag == 'pit_band' %}
              [{"action": "SMOKER_PIT_PLUS_25", "title": "Pit +25°F (pauses program)"}, {"action": "SMOKER_PIT_MINUS_25", "title": "Pit −25°F (pauses program)"}]
            {% elif tag == 'program' and ('paused' in (trigger.event.data.title | lower) or 'restarted' in (trigger.event.data.title | lower)) %}
              [{"action": "SMOKER_RESUME_PROGRAM", "title": "Resume program"}]
            {% elif tag.startswith('stall_') and 'stall' == trigger.event.data.title.split(' ')[-1] %}
              [{"action": "SMOKER_WRAPPED_{{ tag[6:] | upper }}", "title": "I wrapped it"}]
            {% else %}[]{% endif %}
      - action: script.smoker_notify
        data:
          title: "{{ trigger.event.data.title }}"
          message: "{{ trigger.event.data.message }}"
          priority: "{{ trigger.event.data.priority }}"
          tag: "{{ tag }}"
          actions: "{{ buttons }}"

  - id: smoker_notification_actions
    alias: Smoker - notification buttons
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.action.startswith('SMOKER_') }}"
    actions:
      - variables:
          a: "{{ trigger.event.data.action }}"
      - choose:
          - conditions: "{{ a == 'SMOKER_START_PROGRAM' }}"
            sequence:
              - action: esphome.gravity980_start_program
          - conditions: "{{ a == 'SMOKER_RESUME_PROGRAM' }}"
            sequence:
              - action: esphome.gravity980_resume_program
          - conditions: "{{ a in ['SMOKER_PIT_PLUS_25', 'SMOKER_PIT_MINUS_25'] }}"
            sequence:
              - action: number.set_value
                target: {entity_id: number.smoker_pit_target}
                data:
                  value: >
                    {% set v = states('number.smoker_pit_target') | float(225) + (25 if a.endswith('PLUS_25') else -25) %}
                    {{ [200, [700, v] | min] | max }}
          - conditions: "{{ a == 'SMOKER_PIT_HOLD' }}"
            sequence:
              - action: esphome.gravity980_stop_program
              - action: number.set_value
                target: {entity_id: number.smoker_pit_target}
                data: {value: 200}
          - conditions: "{{ a.startswith('SMOKER_FOOD_PLUS_5_') }}"
            sequence:
              - variables:
                  # food1 -> food_1, govee2 -> govee_2 (the entity ids HA builds from "Food 1", "Govee 2")
                  key: "{% set k = a.split('_')[-1] | lower %}{{ k[:-1] ~ '_' ~ k[-1:] }}"
                  n: "number.smoker_{{ key }}_target"
              - action: number.set_value
                target: {entity_id: "{{ n }}"}
                data: {value: "{{ [states(n) | float(203) + 5, 350] | min }}"}
          - conditions: "{{ a.startswith('SMOKER_WRAPPED_') }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{% set k = a.split('_')[-1] | lower %}switch.smoker_{{ k[:-1] ~ '_' ~ k[-1:] }}_wrapped"

  - id: smoker_ai_advisor_schedule
    alias: Smoker - AI advisor every 30 minutes during a cook
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: state
        entity_id: binary_sensor.smoker_food_1_stall
        to: "on"
        for: "00:20:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.smoker_cook_active
        state: "on"
      - condition: state
        entity_id: input_boolean.smoker_ai_advisor
        state: "on"
    actions:
      - action: script.smoker_ai_advise

  - id: smoker_ai_plan_refresh
    alias: Smoker - refresh the AI plan when the cook plan changes
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_datetime.smoker_serve_time
          - select.smoker_food_1_protein
          - number.smoker_food_1_weight
          - text.smoker_program
    conditions:
      - condition: state
        entity_id: input_boolean.smoker_ai_advisor
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - delay: "00:02:00"   # let a burst of edits settle
      - action: script.smoker_ai_advise

  - id: smoker_cook_complete_summary
    alias: Smoker - learn and summarise finished cooks
    mode: queued
    triggers:
      - trigger: event
        event_type: esphome.smoker_cook_complete
    actions:
      - variables:
          s: "{{ trigger.event.data.summary | from_json }}"
      - action: logbook.log
        data:
          name: Smoker
          message: >
            {{ s.name }} ({{ s.profile }}{{ ', %.1f kg' % s.weight_kg if s.weight_kg else '' }}) done in
            {{ '%.1f' % s.total_h }} h, stall {{ '%.1f' % s.stall_h }} h at a {{ '%.0f' % (s.pit_c * 9 / 5 + 32) }}°F pit.
            The controller has now learned from {{ s.history_count }} cooks.
          entity_id: sensor.smoker_cooks_learned
      - action: input_number.set_value
        target: {entity_id: input_number.smoker_ai_eta_minutes}
        data: {value: 0}
      - action: timer.start
        target: {entity_id: timer.smoker_rest}
        data:
          duration: "{{ (states('input_number.smoker_rest_minutes') | int(60)) * 60 }}"
      - if:
          - condition: state
            entity_id: input_boolean.smoker_ai_advisor
            state: "on"
        then:
          - action: ai_task.generate_data
            response_variable: review
            data:
              task_name: Smoker cook review
              entity_id: ai_task.google_ai_task
              instructions: |
                Write a friendly two-sentence review of this finished smoker cook with one tip for next time.
                Cook (JSON): {{ trigger.event.data.summary }}. Weather now: {{ state_attr('weather.forecast_home', 'temperature') }}°F.
          - action: input_text.set_value
            target: {entity_id: input_text.smoker_ai_last_cook}
            data: {value: "{{ review.data[:250] }}"}
          - action: script.smoker_notify
            data:
              title: Cook review
              message: "{{ review.data }}"
              priority: 0
              tag: review

  - id: smoker_rest_done
    alias: Smoker - rest finished
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: {entity_id: timer.smoker_rest}
    actions:
      - action: script.smoker_notify
        data:
          title: Rest complete
          message: The meat has rested. Time to slice!
          priority: 1
          tag: rest

  - id: smoker_light_reminder
    alias: Smoker - time to light the grill
    triggers:
      - trigger: template
        value_template: >
          {% set s = states('sensor.smoker_start_cooking_by') %}
          {{ s not in ['unknown', 'unavailable', 'None', ''] and now() >= as_datetime(s) }}
    conditions:
      # Once per plan: the estimate moves every minute, so the trigger can re-arm.
      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none or
             (now() - this.attributes.last_triggered).total_seconds() > 6 * 3600 }}
      - condition: state
        entity_id: binary_sensor.smoker_cook_active
        state: "off"
    actions:
      - action: script.smoker_notify
        data:
          title: Time to light the smoker
          message: >
            To serve at {{ (states('input_datetime.smoker_serve_time') | as_datetime | as_local).strftime('%H:%M') }},
            start now (about {{ (states('sensor.smoker_food_1_estimated_total_cook_time') | float(0) / 60) | round(1) }} h
            cook + {{ states('input_number.smoker_rest_minutes') | int }} min rest).
          priority: 1
          tag: plan

  - id: smoker_controller_offline
    alias: Smoker - controller offline during a cook
    # Only when the controller drops out *during* a cook (every entity goes unavailable at once on a reboot).
    triggers:
      - trigger: state
        entity_id: binary_sensor.smoker_cook_active
        from: "on"
        to: unavailable
        for: "00:03:00"
    actions:
      - action: script.smoker_notify
        data:
          title: Smoker controller offline
          message: Home Assistant has lost contact with the smoker controller for 3 minutes.
          priority: 2
          tag: offline
