# Native (Linux) build of the bridge for end-to-end tests against tools/fake_grill.py.
#   esphome compile tests/host-bridge.yaml && run the binary, see tests/e2e.py
esphome:
  name: smoker-host-test
host:
logger:
  level: INFO
api:
  port: 6053
  actions:
    - action: test_command
      variables:
        command_id: int
        value: int
      then:
        - lambda: |-
            std::string why = id(grill).send_test_command(command_id, value);
            char b[160];
            snprintf(b, sizeof b, "%s FF %02X %02X %02X%s%s", why.empty() ? "sent" : "refused", command_id & 0xFF,
                     (value >> 8) & 0xFF, value & 0xFF, why.empty() ? "" : ": ", why.c_str());
            id(test_result).publish_state(b);
    - action: load_program
      variables:
        program: string
      then:
        - lambda: id(smoker).load_program(program);
    - action: start_program
      then:
        - lambda: id(smoker).start_program();
    - action: resume_program
      then:
        - lambda: id(smoker).resume_program();
    - action: fuel_level
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_level(percent);
    - action: fuel_refilled
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_refilled(percent);
    - action: set_forecast
      variables:
        minutes: float[]
        temps: float[]
      then:
        - lambda: id(smoker).set_forecast(minutes, temps);
external_components:
  - source:
      type: local
      path: ../components
gravity980:
  id: grill
  host: 127.0.0.1
  port: 13333
  temperature_unit: F
sensor:
  - platform: template
    id: timer_left
    name: Timer remaining
    icon: mdi:timer-sand
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: never
  - platform: gravity980
    pit_temperature: {id: pit_temp, name: Pit temperature}
    pit_target: {id: pit_target_reported, name: Pit target reported}
    food1_temperature: {id: food1_temp, name: Grill probe 1 temperature}
    food1_target: {id: food1_target_reported, name: Grill probe 1 target reported}
  - platform: template
    id: spare_probe
    name: Spare probe
    unit_of_measurement: "°C"
    lambda: return 57.5f;  # 135.5 °F: a value the fake grill (whole °F) never reports
    update_interval: 2s
binary_sensor:
  - platform: gravity980
    connected: {id: grill_connected, name: Grill connected}
    door: {id: lid_open, name: Lid}
    fan: {id: grill_fan, name: Fan}
text_sensor:
  - platform: template
    name: Boost status
    icon: mdi:fan-plus
    update_interval: 5s
    lambda: return id(grill).boost_status();
  - platform: template
    id: test_result
    name: Command test
    update_interval: never
  - platform: gravity980
    link: {name: Grill link}
    link_status: {name: Grill link status}
    captured_commands: {name: Captured app commands}
number:
  # A kitchen timer, like the Char-Griller app's: set minutes to start (0 stops), "Timer remaining" counts down and
  # a notification says when it's done. Kept in the controller, so it works without Home Assistant (not across a
  # restart).
  - platform: template
    id: kitchen_timer
    name: Timer
    icon: mdi:timer-outline
    unit_of_measurement: min
    min_value: 0
    max_value: 1440
    step: 1
    mode: box
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: |-
          if (x <= 0) {
            id(timer_end_ms) = 0;
          } else {
            uint32_t e = millis() + uint32_t(x * 60000.0f);
            id(timer_end_ms) = e ? e : 1;
          }
          id(timer_left).publish_state(x > 0 ? x * 60.0f : 0.0f);
  - platform: gravity980
    pit_target: {id: pit_setpoint, name: Pit target}
    food1_target: {id: grill_food1_target, name: Grill probe 1 target}
cook_assistant:
  id: smoker
  temperature_unit: F
  pit_temperature: pit_temp
  pit_setpoint: pit_target_reported
  lid: lid_open
  link: grill_connected
  fan: grill_fan
  fuel_level: {name: Charcoal level}
  fuel_hours_left: {name: Charcoal hours left}
  fuel_empty_at: {name: Charcoal empty at}
  fuel_basis: {name: Charcoal estimate basis}
  slice_at: {name: Slice at}
  on_set_pit:
    - lambda: id(smoker).pit_write_result(id(grill).request_target(esphome::gravity980::PROBE_PIT, x));
  on_notify:
    - logger.log:
        format: "NOTIFY %d %s: %s"
        args: [priority, title.c_str(), message.c_str()]
  probes:
    - key: food1
      name: Food 1
      sources:
        - name: Grill probe 1
          temperature: food1_temp
          target: food1_target_reported
          sync: grill_food1_target
        - name: Spare
          temperature: spare_probe
          unit: C
      source: {name: Food 1 probe}
      target_number: {name: Food 1 target}
      reading: {name: Food 1 temperature}
      profile: {name: Food 1 protein}
      weight: {name: Food 1 weight}
      time_remaining: {name: Food 1 time remaining}
      estimated_total: {name: Food 1 estimated total}
      phase: {name: Food 1 phase}
      estimate_info: {name: Food 1 estimate basis}
      rate: {name: Food 1 rate}
      pulled: {name: Food 1 pulled}
      pull_at: {name: Food 1 pull at}
      rest_ready: {name: Food 1 rest ready in}
    - key: food2
      name: Food 2
      temperature: spare_probe
      unit: C
      phase: {name: Food 2 phase}
      reading: {name: Food 2 temperature}
  program_status: {name: Program status}
  program_state: {name: Program state}
  program_error: {name: Program error}
text:
  - platform: template
    name: Grill photo URL
    mode: text
    max_length: 255
    optimistic: true
    initial_value: ""

switch:
  # Capture mode: no Bluetooth on the host, so turning it on is refused (the device page's card is still drawn).
  - platform: gravity980
    app_capture: {name: Capture the app's commands}
  # Boost: the panel's turbo has no remote command, so the pit target goes up 100 °F (fan hard) until the pit reaches
  # the real target or 15 minutes pass, then back. The pit target entities keep showing the real target.
  - platform: template
    name: Boost
    icon: mdi:fan-plus
    lambda: return id(grill).boosting();
    turn_on_action:
      - lambda: id(grill).start_boost(15);
    turn_off_action:
      - lambda: id(grill).stop_boost();
  - platform: template
    name: Command tests
    lambda: return id(grill).test_mode();
    turn_on_action:
      - lambda: id(grill).set_test_mode(true);
    turn_off_action:
      - lambda: id(grill).set_test_mode(false);

button:
  - platform: gravity980
    clear_capture: {name: Clear captured app commands}

globals:
  - id: timer_end_ms
    type: uint32_t
    initial_value: "0"

interval:
  # The kitchen timer: counts down, then notifies (like the app's "Timer has finished").
  - interval: 5s
    then:
      - lambda: |-
          if (id(timer_end_ms) == 0) return;
          int32_t left = int32_t(id(timer_end_ms) - millis());
          if (left > 0) {
            id(timer_left).publish_state(float((left + 999) / 1000));
            return;
          }
          id(timer_end_ms) = 0;
          id(timer_left).publish_state(0);
          auto call = id(kitchen_timer).make_call();
          call.set_value(0);
          call.perform();
          id(smoker).notify("Timer finished", "Your smoker timer is done.", 1, "timer");

