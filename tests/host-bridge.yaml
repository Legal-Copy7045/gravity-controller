# Native (Linux) build of the bridge for end-to-end tests against tools/fake_grill.py.
#   esphome compile tests/host-bridge.yaml && run the binary, see tests/e2e.py
esphome:
  name: smoker-host-test
host:
logger:
  level: INFO
api:
  port: 6053
  actions:
    - action: load_program
      variables:
        program: string
      then:
        - lambda: id(smoker).load_program(program);
    - action: start_program
      then:
        - lambda: id(smoker).start_program();
    - action: resume_program
      then:
        - lambda: id(smoker).resume_program();
    - action: fuel_level
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_level(percent);
    - action: fuel_refilled
      variables: {percent: float}
      then:
        - lambda: id(smoker).fuel_refilled(percent);
    - action: set_forecast
      variables:
        minutes: float[]
        temps: float[]
      then:
        - lambda: id(smoker).set_forecast(minutes, temps);
external_components:
  - source:
      type: local
      path: ../components
gravity980:
  id: grill
  host: 127.0.0.1
  port: 13333
  temperature_unit: F
sensor:
  - platform: gravity980
    pit_temperature: {id: pit_temp, name: Pit temperature}
    pit_target: {id: pit_target_reported, name: Pit target reported}
    food1_temperature: {id: food1_temp, name: Grill probe 1 temperature}
    food1_target: {id: food1_target_reported, name: Grill probe 1 target reported}
  - platform: template
    id: spare_probe
    name: Spare probe
    unit_of_measurement: "°C"
    lambda: return 57.5f;  # 135.5 °F: a value the fake grill (whole °F) never reports
    update_interval: 2s
binary_sensor:
  - platform: gravity980
    connected: {id: grill_connected, name: Grill connected}
    door: {id: lid_open, name: Lid}
    fan: {id: grill_fan, name: Fan}
number:
  - platform: gravity980
    pit_target: {id: pit_setpoint, name: Pit target}
    food1_target: {id: grill_food1_target, name: Grill probe 1 target}
cook_assistant:
  id: smoker
  temperature_unit: F
  pit_temperature: pit_temp
  pit_setpoint: pit_target_reported
  lid: lid_open
  link: grill_connected
  fan: grill_fan
  fuel_level: {name: Charcoal level}
  fuel_hours_left: {name: Charcoal hours left}
  fuel_empty_at: {name: Charcoal empty at}
  fuel_basis: {name: Charcoal estimate basis}
  slice_at: {name: Slice at}
  on_set_pit:
    - lambda: id(smoker).pit_write_result(id(grill).request_target(esphome::gravity980::PROBE_PIT, x));
  on_notify:
    - logger.log:
        format: "NOTIFY %d %s: %s"
        args: [priority, title.c_str(), message.c_str()]
  probes:
    - key: food1
      name: Food 1
      sources:
        - name: Grill probe 1
          temperature: food1_temp
          target: food1_target_reported
          sync: grill_food1_target
        - name: Spare
          temperature: spare_probe
          unit: C
      source: {name: Food 1 probe}
      target_number: {name: Food 1 target}
      reading: {name: Food 1 temperature}
      profile: {name: Food 1 protein}
      weight: {name: Food 1 weight}
      time_remaining: {name: Food 1 time remaining}
      estimated_total: {name: Food 1 estimated total}
      phase: {name: Food 1 phase}
      estimate_info: {name: Food 1 estimate basis}
      rate: {name: Food 1 rate}
      pulled: {name: Food 1 pulled}
      pull_at: {name: Food 1 pull at}
      rest_ready: {name: Food 1 rest ready in}
    - key: food2
      name: Food 2
      temperature: spare_probe
      unit: C
      phase: {name: Food 2 phase}
      reading: {name: Food 2 temperature}
  program_status: {name: Program status}
  program_state: {name: Program state}
  program_error: {name: Program error}
