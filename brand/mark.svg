<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Smoker">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#b4330a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <!-- hopper tower -->
  <rect x="160" y="52" width="42" height="132" rx="7" fill="#1c1917"/>
  <rect x="155" y="46" width="52" height="14" rx="5" fill="#1c1917"/>
  <!-- barrel -->
  <rect x="44" y="104" width="124" height="62" rx="31" fill="#1c1917"/>
  <!-- flame in the barrel -->
  <path d="M106 158c-15 0-24-10-24-22 0-11 8-17 12-27 1 7 5 11 9 13 0-11 7-21 15-27-2 10 3 17 9 24 5 6 8 11 8 17 0 13-11 22-29 22z" fill="url(#flame)"/>
  <!-- legs and shelf -->
  <rect x="62" y="166" width="10" height="42" rx="4" fill="#1c1917"/>
  <rect x="140" y="166" width="10" height="42" rx="4" fill="#1c1917"/>
  <rect x="54" y="190" width="104" height="8" rx="4" fill="#1c1917"/>
  <!-- smoke -->
  <path d="M181 40c-7-8 7-14 0-24" fill="none" stroke="#fff7ed" stroke-width="7" stroke-linecap="round" opacity=".85"/>
</svg>
