    <rect x="161" y="44" width="52" height="16" rx="6"/>
    <rect x="43" y="100" width="134" height="66" rx="33"/>
    <rect x="66" y="160" width="11" height="52" rx="4"/>
    <rect x="143" y="160" width="11" height="52" rx="4"/>
    <rect x="56" y="190" width="108" height="9" rx="4.5"/>
  </g>
  <!-- the flame, centred in the barrel -->
  <path transform="translate(110 133) scale(.74) translate(-108.5 -126.5)" fill="url(#flame)"
        d="M106 158c-15 0-24-10-24-22 0-11 8-17 12-27 1 7 5 11 9 13 0-11 7-21 15-27-2 10 3 17 9 24 5 6 8 11 8 17 0 13-11 22-29 22z"/>
